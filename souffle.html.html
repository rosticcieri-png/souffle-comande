<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Soufflé — Comande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood: #2B2118;
    --wood-light: #3D2F22;
    --wood-lighter: #4C3B2A;
    --paper: #F7F1E1;
    --paper-dim: #EDE4CC;
    --ink: #201A12;
    --ink-soft: #6b5f4d;
    --ember: #D94F2B;
    --ember-dark: #B33E20;
    --basil: #7A9471;
    --gold: #C89B3C;
    --line: #5a4a37;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--wood);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 60%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 80px);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header{
    padding: 20px 28px 16px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 10px;
  }
  header h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: 1px;
    margin:0;
    color: var(--paper);
  }
  header h1 span{ color: var(--ember); }
  header .tag{
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    color: #a8977d;
  }

  .top-fisso{
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--wood);
    padding-bottom: 10px;
    box-shadow: 0 8px 14px -6px rgba(0,0,0,0.5);
  }
  .top-fisso .board{ margin-top: 8px; }

  main{
    display:flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 18px;
    padding: 14px 28px 10px;
  }
  @media (max-width: 900px){
    main{ flex-direction: column; }
  }

  .panel{
    background: var(--wood-light);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
  }
  .panel.order-panel{
    flex: 0 0 380px;
    max-width: 380px;
    padding: 0;
    position: sticky;
    top: 112px; /* appena sotto header+bacheca, che restano fissi in alto */
    max-height: calc(100vh - 124px);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* lo scroll avviene dentro .order-scroll, i pulsanti restano fissi */
  }
  @media (max-width: 900px){
    .panel.order-panel{ position: static; max-width: 100%; max-height: 58vh; }
  }
  .order-scroll{
    overflow-y: auto;
    padding: 12px 14px 4px;
  }
  .order-panel .send-row{
    flex-shrink: 0;
    margin: 0; padding: 8px 14px;
    background: var(--wood-light);
    border-top: 1px solid var(--line);
  }
  .panel.order-panel h2{ font-size: 16px; margin-bottom: 6px; }
  .panel.menu-panel{ flex: 1; min-width: 0; }
  .panel h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.5px;
    margin: 0 0 12px;
    color: var(--gold);
    text-transform: uppercase;
  }

  .cat-block + .cat-block{ margin-top: 16px; }

  .menu-pagine{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .pagina-tab{
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--wood-lighter); color: var(--paper); cursor:pointer;
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:15px;
    letter-spacing: 0.3px;
  }
  .pagina-tab.active{ background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .cat-title{
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #a8977d;
    margin-bottom: 10px;
    font-weight: 700;
  }
  .btn-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  @media (max-width: 600px){
    .btn-grid{ grid-template-columns: repeat(3, 1fr); }
  }
  .item-btn{
    background: var(--wood-lighter);
    border: 1px solid var(--line);
    border-left: 5px solid var(--cat-color, var(--gold));
    color: var(--paper);
    border-radius: 8px;
    padding: 10px 10px;
    min-height: 48px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .item-btn:hover{ background: #5a4732; }
  .item-btn:active{ transform: scale(0.97); }
  .item-btn .name{ display:block; font-weight:700; font-size: 16px; line-height: 1.22; }
  .item-btn .price{ display:block; font-size: 15px; color: var(--cat-color, var(--gold)); margin-top: 4px; font-weight:600; font-family:'IBM Plex Mono', monospace; }

  /* ORDER IN PROGRESS */
  .current-list{ min-height: 40px; margin-bottom: 14px; }
  .current-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
  }
  .current-row .qty-controls{ display:flex; align-items:center; gap:6px; }
  .current-row button.step{
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--wood-lighter); color: var(--paper); cursor:pointer; font-size: 14px; line-height: 1;
  }
  .current-row .qty{ font-family:'IBM Plex Mono', monospace; min-width: 16px; text-align:center; }
  .current-row button.price-tag{
    border: 1px solid var(--gold); background: transparent; color: var(--gold);
    border-radius: 6px; padding: 3px 7px; font-size: 12px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
  }
  .current-row button.price-tag:hover{ background: var(--gold); color: var(--ink); }
  .current-row button.remove-line{
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: #a8756a; cursor:pointer; font-size: 12px; line-height: 1;
  }
  .current-row button.remove-line:hover{ background: var(--ember); border-color: var(--ember); color: var(--paper); }
  .empty-hint{ color:#8a7c65; font-size: 13px; font-style: italic; padding: 8px 0; }

  .qz-status{ font-size: 11px; color:#a8977d; padding: 6px 14px 0; }
  .qz-status.ok{ color: var(--basil); }
  .qz-status.no{ color: var(--gold); }
  .send-row{ display:flex; gap:8px; margin-top:14px; }
  .send-btn{
    flex: 1;
    background: var(--ember);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 14px 8px;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .send-btn.small{ background: var(--wood-lighter); border: 1px solid var(--ember); }
  .send-btn:hover{ background: var(--ember-dark); }
  .send-btn.small:hover{ background: var(--ember); }
  .send-btn:disabled{ background:#5a4a37; border-color:#5a4a37; cursor:not-allowed; }

  /* STAMPA: nasconde tutto tranne il contenuto scelto, in bianco e nero */
  .print-only{ display:none; }
  @media print{
    @page{ margin: 2mm; }
    body *{ visibility: hidden; }
    #printArea, #printArea *{ visibility: visible; }
    #printArea{
      display:block !important;
      position:absolute; top:0; left:0;
      width: 280px; /* larghezza fissa adatta a una stampante da scontrini (~72-80mm) */
      max-width: 100%;
      background:#fff; color:#000;
    }
    #printArea .receipt{
      background:#fff; color:#000; box-shadow:none; clip-path:none;
      font-family:'IBM Plex Mono', monospace; font-size:13px; padding:0 0 20px;
      width: 100%; box-sizing: border-box;
    }
    #printArea .r-row{ flex-wrap: wrap; }
    #printArea .r-note{ color:#333; }
    #printArea .print-pagebreak{ page-break-after: always; }
  }

  /* RECEIPT PREVIEW TABS */
  .tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .tab{
    flex:1; text-align:center; padding: 8px; border-radius: 6px;
    background: var(--wood-lighter); color:#c9bda3; cursor:pointer;
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid var(--line);
  }
  .tab.active{ background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight:600; }

  .receipt{
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 18px 16px 26px;
    position: relative;
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 96%,
      95% 100%, 90% 96%, 85% 100%, 80% 96%, 75% 100%, 70% 96%, 65% 100%,
      60% 96%, 55% 100%, 50% 96%, 45% 100%, 40% 96%, 35% 100%, 30% 96%,
      25% 100%, 20% 96%, 15% 100%, 10% 96%, 5% 100%, 0% 96%
    );
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }
  .receipt .r-head{ text-align:center; font-weight:600; margin-bottom:2px; }
  .receipt .r-meta{ text-align:center; font-size:11px; color: var(--ink-soft); margin-bottom:10px; }
  .receipt hr{ border:none; border-top: 1px dashed var(--ink-soft); margin: 8px 0; }
  .receipt .r-cat{ font-weight:700; margin: 10px 0 4px; }
  .receipt .r-row{ display:flex; justify-content:space-between; gap: 10px; padding: 2px 0; }
  .receipt .r-note{ padding-left: 14px; color: var(--ink-soft); font-size: 12px; }
  .receipt .r-total{ display:flex; justify-content:space-between; font-weight:700; font-size:15px; margin-top:8px; }
  .receipt .r-empty{ text-align:center; color: var(--ink-soft); padding: 20px 0; font-style: italic; }

  /* Comanda cucina a schermo: caratteri più grandi per leggerla meglio da lontano */
  #receiptView.vista-cucina .receipt{ font-size: 18px; padding: 22px 20px 30px; }
  #receiptView.vista-cucina .r-head{ font-size: 17px; }
  #receiptView.vista-cucina .r-cat{ font-size: 19px; margin: 14px 0 6px; }
  #receiptView.vista-cucina .r-row{ padding: 4px 0; }
  #receiptView.vista-cucina .r-note{ font-size: 15px; }

  /* OPEN ORDERS BOARD */
  .board{
    margin: 0 28px 6px;
    padding: 6px 10px;
    background: var(--wood-lighter);
    border: 1px solid var(--gold);
    border-radius: 8px;
  }
  .board h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-size: 11px; letter-spacing:0.5px; color: var(--gold);
    text-transform: uppercase; margin: 0 0 4px; opacity: 0.8;
  }
  .board-grid{
    display:flex; flex-direction: row; flex-wrap: nowrap;
    gap: 6px; overflow-x: auto; padding-bottom: 2px;
  }
  .order-card{
    background: var(--wood-light);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    flex: 0 0 auto;
    display:flex; align-items:center; gap:6px;
    white-space: nowrap;
  }
  .order-card.late{
    border-color: var(--ember);
    box-shadow: 0 0 0 1px var(--ember) inset;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ background: var(--wood-light); }
    50%{ background: #4a2c22; }
  }
  .order-card .top{ display:flex; align-items:center; gap:6px; }
  .order-card .num{ font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:14px; color: var(--gold); }
  .order-card.late .num{ color: var(--ember); }
  .order-card .time{ display:none; } /* nascosto per risparmiare spazio nella striscia sottile */
  .order-card .elapsed{ font-size: 10px; color:#c9bda3; white-space:nowrap; }
  .order-card.late .elapsed{ color: var(--ember); font-weight:600; }
  .order-card .edit-btn{
    background: var(--wood); border: 1px solid var(--gold); color: var(--gold);
    border-radius: 5px; padding: 3px 6px; font-size:10px; font-weight:600; cursor:pointer;
  }
  .order-card .close-btn{
    background: var(--basil); border:none; color: var(--ink);
    border-radius: 5px; padding: 3px 6px; font-size:10px; font-weight:600; cursor:pointer;
  }
  .board-empty{ color:#8a7c65; font-style: italic; font-size: 11px; }

  @media (prefers-reduced-motion: reduce){
    .order-card.late{ animation: none; }
  }

  /* SUGGERIMENTO */
  .hint-tasti{
    font-size: 12px; color:#a8977d; font-style: italic;
    margin-bottom: 12px; line-height: 1.4;
  }

  /* MICROFONO BREVE (dentro l'editor della variazione) */
  .mic-btn{
    flex-shrink:0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid var(--basil);
    background: var(--wood);
    color: var(--basil);
    font-size: 15px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all 0.15s ease;
  }
  .mic-btn:hover{ background: var(--basil); color: var(--ink); }
  .mic-btn.listening{
    background: var(--ember);
    border-color: var(--ember);
    color: var(--paper);
    animation: mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(217,79,43,0.5); }
    50%{ box-shadow: 0 0 0 8px rgba(217,79,43,0); }
  }

  /* EDITOR DELLA VARIAZIONE (per riga) */
  .editing-row{ display:block !important; padding: 10px 0; }
  .edit-note-label{ font-size: 14px; font-weight:600; margin-bottom: 8px; }
  .edit-note-controls{ display:flex; gap:8px; align-items:center; margin-bottom: 8px; }
  .edit-note-controls input{
    flex:1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--wood); color: var(--paper); font-size: 14px;
  }
  .edit-note-actions{ display:flex; gap:8px; }
  .edit-note-actions button{
    flex:1; padding: 8px; border-radius: 6px; border:none; cursor:pointer;
    font-weight:600; font-size: 13px;
  }
  .save-note-btn{ background: var(--basil); color: var(--ink); }
  .cancel-note-btn{ background: var(--wood-lighter); color: var(--paper); border: 1px solid var(--line) !important; }

  @media (prefers-reduced-motion: reduce){
    .mic-btn.listening{ animation: none; }
  }

  .edit-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: rgba(200,155,60,0.15);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .edit-banner button{
    background: none; border: 1px solid var(--gold); color: var(--gold);
    border-radius: 6px; padding: 4px 10px; font-size:12px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="top-fisso">
  <header>
    <h1>Souffl<span>é</span> — Comande</h1>
    <div class="tag">Comanda cucina · Scontrino cliente</div>
  </header>

  <div class="board">
    <h2>📋 Ordini aperti</h2>
    <div class="board-grid" id="board"></div>
  </div>
</div>

<main>
  <div class="panel order-panel">
    <div class="order-scroll">
      <h2 id="orderPanelTitle">Ordine in corso</h2>
      <div class="edit-banner" id="editBanner" style="display:none;"></div>

      <div class="hint-tasti">Tocca un prodotto dal menù per aggiungerlo. Su ogni riga puoi poi toccare ✎ per dire o scrivere una variazione (es. "senza origano", "con pepe").</div>

      <div class="current-list" id="currentList"></div>

      <div class="tabs">
        <div class="tab active" data-tab="cucina">Comanda cucina</div>
        <div class="tab" data-tab="cliente">Scontrino cliente</div>
      </div>
      <div id="receiptView"></div>
    </div>

    <div class="qz-status" id="qzStatus">Verifico QZ Tray...</div>
    <div class="send-row">
      <button class="send-btn small" id="sendCucinaBtn">🍳 Solo cucina</button>
      <button class="send-btn small" id="sendClienteBtn">🧾 Solo cliente</button>
      <button class="send-btn" id="sendEntrambeBtn">🖨️ Entrambe</button>
    </div>
  </div>

  <div class="panel menu-panel">
    <h2>Menù</h2>
    <div class="menu-pagine">
      <button class="pagina-tab active" data-pagina="bibite">🍺 Bibite &amp; Friggitoria</button>
      <button class="pagina-tab" data-pagina="pizze">🍕 Pizze</button>
      <button class="pagina-tab" data-pagina="saltimbocca">🥙 Saltimbocca</button>
    </div>
    <div id="menu"></div>
  </div>
</main>

<div id="printArea" class="print-only"></div>

<script>
// ---------------------------------------------------------------------
// CATALOGO — modifica qui prezzi e voci secondo il menù reale
// ---------------------------------------------------------------------
const CATALOGO = [
  // 🍕 PIZZE ROSSE
  { id:'margherita', base:'Margherita', price:5.00, category:'🍕 Pizze rosse', voice:['margherit'] },

  { id:'napoletana', base:'Napoletana', price:4.50, category:'🍕 Pizze rosse', voice:['napoletan'] },

  // 🧀 PIZZE BIANCHE

  { id:'caprese', base:'Caprese', price:6.00, category:'🧀 Pizze bianche', voice:['capres'] },
  { id:'crocche_pizza', base:'Crocché', price:7.00, category:'🧀 Pizze bianche', voice:['pizza crocché','pizza crocche'] },

  { id:'fungotto', base:'Fungotto', price:7.50, category:'🧀 Pizze bianche', voice:['fungott'] },
  { id:'ortolana', base:'Ortolana', price:8.00, category:'🧀 Pizze bianche', voice:['ortolan'] },
  { id:'poldo', base:'Poldo', price:7.00, category:'🧀 Pizze bianche', voice:['poldo'] },
  { id:'primavera', base:'Primavera', price:7.00, category:'🧀 Pizze bianche', voice:['primaver'] },
  { id:'pugliese', base:'Pugliese', price:8.00, category:'🧀 Pizze bianche', voice:['pugliese'] },
  { id:'salernitana', base:'Salernitana', price:8.00, category:'🧀 Pizze bianche', voice:['salernitan'] },
  { id:'souffle_pizza', base:'Soufflé', price:7.50, category:'🧀 Pizze bianche', voice:['souffl','soffl'] },

  // 📏 METRO E MIGNON
  { id:'metro_margherita', base:'¼ Metro Margherita', price:12.00, category:'📏 Metro e mignon', voice:['metro margherita'] },
  { id:'metro_farcito', base:'¼ Metro Farcito', price:14.00, category:'📏 Metro e mignon', voice:['metro farcito'] },
  { id:'portafoglio', base:'Pizza a portafoglio', price:3.50, category:'📏 Metro e mignon', voice:['portafoglio'] },
  { id:'mignon_margherita', base:'Mignon Margherita', price:2.00, category:'📏 Metro e mignon', voice:['mignon margherita'] },
  { id:'mignon_farcita', base:'Mignon Farcita', price:2.50, category:'📏 Metro e mignon', voice:['mignon farcita'] },

  // 🥐 CALZONE AL FORNO
  { id:'calzone_forno', base:'Ripieno al forno', price:7.00, category:'🥐 Ripieno al forno', voice:['ripieno al forno','ripieno','calzone al forno','calzone'], flavorFree:true },

let orderCounter = 0;

const fmtEuro = n => '€' + n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtOra = d => d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
const fmtData = d => d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'2-digit'});
const prod = catId => CATALOGO.find(p => p.id === catId);

// ---------------------------------------------------------------------
// MEMORIA LOCALE — tiene traccia degli ordini anche ricaricando la pagina.
// Si azzera automaticamente a ogni nuovo giorno (il numero riparte da 1).
// ---------------------------------------------------------------------
const CHIAVE_STATO = 'souffle_stato_v2';
const oggiStr = () => new Date().toDateString();

function salvaStato(){
  try{
    const stato = {
      giorno: oggiStr(),
      orderCounter,
      nextLineId,
      openOrders: openOrders.map(o => ({ ...o, orario: o.orario.toISOString() })),
      currentOrder,
      editingOrderNumber
    };
    localStorage.setItem(CHIAVE_STATO, JSON.stringify(stato));
  } catch(e){ /* memoria locale non disponibile: l'app funziona comunque, solo senza salvataggio */ }
}

function caricaStato(){
  try{
    const raw = localStorage.getItem(CHIAVE_STATO);
    if(!raw) return;
    const stato = JSON.parse(raw);
    if(stato.giorno !== oggiStr()) return; // nuovo giorno: si riparte puliti

    orderCounter = stato.orderCounter || 0;
    nextLineId = stato.nextLineId || 1;
    openOrders = (stato.openOrders || []).map(o => ({ ...o, orario: new Date(o.orario) }));
    currentOrder = stato.currentOrder || [];
    editingOrderNumber = (stato.editingOrderNumber === undefined) ? null : stato.editingOrderNumber;

    // Scarta eventuali righe che fanno riferimento a prodotti non più
    // presenti nel catalogo (es. dopo un aggiornamento del menù), così
    // un vecchio ordine salvato non manda in errore tutta la pagina.
    currentOrder = currentOrder.filter(l => !!prod(l.catId));
    openOrders.forEach(o => {
      o.voci = (o.voci || []).filter(v => !!prod(v.catId));
      o.totale = o.voci.reduce((sum, v) => {
        const prezzo = (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : prod(v.catId).price;
        return sum + prezzo * v.qty;
      }, 0);
    });
    openOrders = openOrders.filter(o => o.voci.length > 0);
  } catch(e){ /* niente da recuperare */ }
}

// ---------------------------------------------------------------------
// GESTIONE RIGHE ORDINE (con supporto a varianti/note libere)
// ---------------------------------------------------------------------
// Aggiunge una quantità di un prodotto all'ordine in corso. Se esiste già
// una riga con lo stesso prodotto E la stessa nota libera, le quantità si
// sommano (unione automatica); altrimenti si crea una nuova riga.
function aggiungiRiga(catId, qty, extra){
  const norm = extra ? extra.trim().toLowerCase() : null;
  const linea = currentOrder.find(l => l.catId === catId && (l.extra || null) === norm);
  if(linea){
    linea.qty += qty;
  } else {
    currentOrder.push({ lineId: nextLineId++, catId, qty, extra: norm });
  }
}

function lineLabel(line){
  const p = prod(line.catId);
  let label = p.base;
  if(p.note) label += ' (' + p.note + ')';
  return label;
}

// Prezzo effettivo di una riga: quello corretto a mano se presente,
// altrimenti quello del catalogo. Utile per prodotti a gusto/prezzo
// variabile (es. arancini, frittatine) che cambiano ogni giorno.
function prezzoLinea(line){
  return (line.prezzoManuale !== undefined && line.prezzoManuale !== null) ? line.prezzoManuale : prod(line.catId).price;
}

function currentTotal(){
  return currentOrder.reduce((sum, l) => sum + prezzoLinea(l) * l.qty, 0);
}

function renderCurrent(){
  const list = document.getElementById('currentList');
  const righe = currentOrder.filter(l => l.qty > 0);

  if(righe.length === 0){
    list.innerHTML = '<div class="empty-hint">Nessuna voce ancora. Tocca un prodotto dal menù.</div>';
    editandoLineId = null;
  } else {
    list.innerHTML = righe.map(l => {
      if(l.lineId === editandoLineId){
        return `
          <div class="current-row editing-row">
            <div class="edit-note-label">${lineLabel(l)}</div>
            <div class="edit-note-controls">
              <input type="text" id="editNoteInput" value="${(l.extra || '').replace(/"/g,'&quot;')}" placeholder="es. senza origano, con pepe...">
              <button class="mic-btn" id="editNoteMic" title="Detta la variazione">🎤</button>
            </div>
            <div class="edit-note-actions">
              <button class="save-note-btn" data-lineid="${l.lineId}">✔ Salva</button>
              <button class="cancel-note-btn" data-lineid="${l.lineId}">Annulla</button>
            </div>
          </div>`;
      }
      return `
      <div class="current-row">
        <span>${lineLabel(l)}${l.extra ? `<br><small style="color:#a8977d;">${l.extra}</small>` : ''}</span>
        <div class="qty-controls">
          <button class="price-tag" data-lineid="${l.lineId}" title="Tocca per correggere il prezzo">${fmtEuro(prezzoLinea(l))}</button>
          <button class="edit-note" data-lineid="${l.lineId}" title="Aggiungi/modifica variazione">✎</button>
          <button class="step" data-lineid="${l.lineId}" data-delta="-1">−</button>
          <span class="qty">${l.qty}</span>
          <button class="step" data-lineid="${l.lineId}" data-delta="1">+</button>
          <button class="remove-line" data-lineid="${l.lineId}" title="Elimina questa voce">🗑</button>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.step').forEach(btn => {
      btn.addEventListener('click', () => {
        const lineId = parseInt(btn.dataset.lineid);
        const delta = parseInt(btn.dataset.delta);
        const linea = currentOrder.find(l => l.lineId === lineId);
        if(linea){
          linea.qty = Math.max(0, linea.qty + delta);
          if(linea.qty === 0) currentOrder = currentOrder.filter(l => l.lineId !== lineId);
        }
        renderCurrent();
      });
    });
    list.querySelectorAll('.remove-line').forEach(btn => {
      btn.addEventListener('click', () => {
        const lineId = parseInt(btn.dataset.lineid);
        currentOrder = currentOrder.filter(l => l.lineId !== lineId);
        renderCurrent();
      });
    });
    list.querySelectorAll('.price-tag').forEach(btn => {
      btn.addEventListener('click', () => {
        const lineId = parseInt(btn.dataset.lineid);
        const linea = currentOrder.find(l => l.lineId === lineId);
        if(!linea) return;
        const attuale = prezzoLinea(linea);
        const risposta = prompt('Prezzo per questa voce (€):', attuale.toFixed(2).replace('.', ','));
        if(risposta === null) return; // annullato
        const pulito = risposta.trim().replace(',', '.');
        if(pulito === ''){
          delete linea.prezzoManuale; // torna al prezzo di catalogo
        } else {
          const valore = parseFloat(pulito);
          if(!isNaN(valore) && valore >= 0) linea.prezzoManuale = valore;
        }
        renderCurrent();
      });
    });
    list.querySelectorAll('.edit-note').forEach(btn => {
      btn.addEventListener('click', () => {
        editandoLineId = parseInt(btn.dataset.lineid);
        renderCurrent();
      });
    });
    list.querySelectorAll('.save-note-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lineId = parseInt(btn.dataset.lineid);
        const linea = currentOrder.find(l => l.lineId === lineId);
        const input = document.getElementById('editNoteInput');
        if(linea && input) linea.extra = input.value.trim() || null;
        editandoLineId = null;
        renderCurrent();
      });
    });
    list.querySelectorAll('.cancel-note-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        editandoLineId = null;
        renderCurrent();
      });
    });
    const micNota = document.getElementById('editNoteMic');
    if(micNota){
      micNota.addEventListener('click', () => {
        dettaBreve(
          () => { micNota.classList.add('listening'); micNota.textContent = '●'; },
          (testo) => {
            micNota.classList.remove('listening'); micNota.textContent = '🎤';
            const input = document.getElementById('editNoteInput');
            if(input && testo) input.value = testo;
          },
          () => { micNota.classList.remove('listening'); micNota.textContent = '🎤'; }
        );
      });
    }
  }

  ['sendCucinaBtn','sendClienteBtn','sendEntrambeBtn'].forEach(id => {
    document.getElementById(id).disabled = righe.length === 0;
  });
  renderReceiptPreview();
  salvaStato();
}

      `).join('')}

}

// Genera l'HTML dello scontrino cliente (con prezzi allineati) per un ordine
function htmlScontrinoCliente(ordine){
  const totale = ordine.voci.reduce((sum, v) => {
    const prezzo = (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : prod(v.catId).price;
    return sum + prezzo * v.qty;
  }, 0);
  return `
    <div class="receipt">
      <div class="r-head">SOUFFLÉ &nbsp; N.${String(ordine.numero).padStart(3,'0')} &nbsp; ${fmtData(ordine.orario)} ${fmtOra(ordine.orario)}</div>
      <hr>
      ${ordine.voci.map(v => {
        const p = prod(v.catId);
        const label = p.base + (p.note ? ' ' + p.note : '');
        const prezzo = (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : p.price;
        return `<div class="r-row"><span>${v.qty} ${label}</span><span>${fmtEuro(prezzo * v.qty)}</span></div>${v.extra ? `<div class="r-note">- ${v.extra}</div>` : ''}`;
      }).join('')}
      <hr>
      <div class="r-total"><span>TOTALE</span><span>${fmtEuro(totale)}</span></div>
    </div>`;
}

function renderReceiptPreview(){
  const view = document.getElementById('receiptView');
  const righe = currentOrder.filter(l => l.qty > 0);

  let numeroPreview, now;
  if(editingOrderNumber !== null){
    const ordineOrig = openOrders.find(o => o.numero === editingOrderNumber);
    numeroPreview = editingOrderNumber;
    now = ordineOrig ? ordineOrig.orario : new Date();
  } else {
    numeroPreview = orderCounter + 1;
    now = new Date();
  }

  if(righe.length === 0){
    view.innerHTML = `<div class="receipt"><div class="r-empty">L'anteprima comparirà qui</div></div>`;
    return;
  }

  const ordineVirtuale = { numero: numeroPreview, orario: now, voci: righe.map(l => ({ catId:l.catId, qty:l.qty, extra:l.extra, prezzoManuale:l.prezzoManuale })) };
  view.innerHTML = activeTab === 'cucina' ? htmlComandaCucina(ordineVirtuale) : htmlScontrinoCliente(ordineVirtuale);
}

// ---------------------------------------------------------------------
// INVIO ORDINE / AGGIORNAMENTO ORDINE ESISTENTE + ANNUNCIO VOCALE + STAMPA
// ---------------------------------------------------------------------

// Finalizza l'ordine in corso (nuovo o in modifica): lo salva, annuncia il
// totale a voce e restituisce l'oggetto ordine completo pronto per la stampa.
// Restituisce null se non c'è nulla da inviare.
function finalizzaOrdine(){
  const righe = currentOrder.filter(l => l.qty > 0);
  if(righe.length === 0) return null;

  const totale = currentTotal();
  const voci = righe.map(l => ({ catId: l.catId, qty: l.qty, extra: l.extra || null, prezzoManuale: (l.prezzoManuale !== undefined ? l.prezzoManuale : null) }));
  let ordineFinale, annuncio;

  if(editingOrderNumber !== null){
    const ordine = openOrders.find(o => o.numero === editingOrderNumber);
    if(ordine){
      ordine.voci = voci;
      ordine.totale = totale;
      ordineFinale = ordine;
    }
    annuncio = `Ordine ${ordineFinale.numero} aggiornato. Nuovo totale ${Math.round(totale)} euro.`;
    uscitaModalitaModifica();
  } else {
    orderCounter += 1;
    ordineFinale = { numero: orderCounter, orario: new Date(), voci, totale };
    openOrders.unshift(ordineFinale);
    annuncio = `Ordine ${ordineFinale.numero}. Totale ${Math.round(totale)} euro.`;
  }

  currentOrder = [];
  renderCurrent();
  renderBoard();

  try{
    const utter = new SpeechSynthesisUtterance(annuncio);
    utter.lang = 'it-IT';
    speechSynthesis.speak(utter);
  } catch(e){ /* sintesi vocale non disponibile su questo dispositivo */ }

  return ordineFinale;
}

// ---------------------------------------------------------------------
// STAMPA DIRETTA VIA QZ TRAY — manda i dati grezzi (ESC/POS) direttamente
// alla stampante di rete, saltando completamente driver e spooler di
// Windows. Se QZ Tray non è installato/avviato, si torna automaticamente
// alla stampa normale del browser.
// ---------------------------------------------------------------------
const STAMPANTE_IP = '192.168.1.123'; // indirizzo di rete della BIXOLON SRP-F310
const STAMPANTE_PORTA = 9100;
const RIGA_ESC = 42; // caratteri per riga in formato testo grezzo

// QZ Tray richiede una promessa di certificato/firma anche per l'uso semplice
// senza certificato: qui diciamo "nessuna firma", quindi la prima volta QZ
// Tray chiederà conferma manuale nella sua finestra (va bene, basta consentire).
if(typeof qz !== 'undefined'){
  qz.security.setCertificatePromise(function(resolve){ resolve(); });
  qz.security.setSignaturePromise(function(){
    return function(resolve){ resolve(); };
  });
}

const ESC = '\x1B', GS = '\x1D';
const P_INIT = ESC + '@';
const P_BOLD_ON = ESC + 'E' + '\x01';
const P_BOLD_OFF = ESC + 'E' + '\x00';
const P_CENTRO = ESC + 'a' + '\x01';
const P_SINISTRA = ESC + 'a' + '\x00';
const P_TAGLIO = GS + 'V' + '\x00';

function padDestraEsc(sinistra, destra, larghezza){
  const spazi = larghezza - sinistra.length - destra.length;
  return sinistra + ' '.repeat(Math.max(spazi, 1)) + destra;
}

function escComandaCucina(ordine){
  let t = P_INIT + P_CENTRO + P_BOLD_ON;
  t += `SOUFFLE  N.${String(ordine.numero).padStart(3,'0')}  ${fmtData(ordine.orario)} ${fmtOra(ordine.orario)}\n`;
  t += P_BOLD_OFF + P_SINISTRA + '-'.repeat(RIGA_ESC) + '\n';
  const categorie = [...new Set(ordine.voci.map(v => prod(v.catId).category))];
  categorie.forEach(cat => {
    t += P_BOLD_ON + cat.replace(/[^\x00-\x7F]/g, '') + P_BOLD_OFF + '\n';
    ordine.voci.filter(v => prod(v.catId).category === cat).forEach(v => {
      const p = prod(v.catId);
      t += `${v.qty} ${p.base}\n`;
      if(p.note) t += `  - ${p.note}\n`;
      if(v.extra) t += `  - ${v.extra}\n`;
    });
  });
  t += '\n\n\n' + P_TAGLIO;
  return t;
}

function escScontrinoCliente(ordine){
  let t = P_INIT + P_CENTRO + P_BOLD_ON;
  t += `SOUFFLE  N.${String(ordine.numero).padStart(3,'0')}  ${fmtData(ordine.orario)} ${fmtOra(ordine.orario)}\n`;
  t += P_BOLD_OFF + P_SINISTRA + '-'.repeat(RIGA_ESC) + '\n';
  let totale = 0;
  ordine.voci.forEach(v => {
    const p = prod(v.catId);
    const prezzo = (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : p.price;
    totale += prezzo * v.qty;
    const label = p.base + (p.note ? ' ' + p.note : '');
    t += padDestraEsc(`${v.qty} ${label}`, fmtEuro(prezzo * v.qty), RIGA_ESC) + '\n';
    if(v.extra) t += `  ${v.extra}\n`;
  });
  t += '-'.repeat(RIGA_ESC) + '\n';
  t += P_BOLD_ON + padDestraEsc('TOTALE', fmtEuro(totale), RIGA_ESC) + P_BOLD_OFF + '\n';
  t += '\n\n\n' + P_TAGLIO;
  return t;
}

async function qzDisponibile(){
  if(typeof qz === 'undefined') return false;
  try{
    if(!qz.websocket.isActive()){
      await qz.websocket.connect();
    }
    return true;
  } catch(e){
    console.warn('QZ Tray non raggiungibile:', e);
    return false;
  }
}

async function stampaViaQZ(testoGrezzo){
  const config = qz.configs.create({ host: STAMPANTE_IP, port: STAMPANTE_PORTA });
  await qz.print(config, [{ type: 'raw', format: 'plain', data: testoGrezzo }]);
}

// Manda alla stampante solo il contenuto scelto (cucina, cliente o entrambe).
// Usa QZ Tray (diretto, affidabile). Se QZ Tray non è proprio raggiungibile,
// usa la finestra di stampa del browser come riserva. Se invece QZ Tray è
// collegato ma la stampa fallisce (es. non hai fatto in tempo a confermare
// la finestrella "Action Required"), avvisa chiaramente invece di tornare
// in silenzio al metodo del browser.
async function stampaOrdine(tipo, ordine){
  const disponibile = await qzDisponibile();

  if(disponibile){
    try{
      if(tipo === 'cucina' || tipo === 'entrambe') await stampaViaQZ(escComandaCucina(ordine));
      if(tipo === 'cliente' || tipo === 'entrambe') await stampaViaQZ(escScontrinoCliente(ordine));
      return;
    } catch(e){
      console.error('Errore durante la stampa via QZ Tray:', e);
      alert(
        'QZ Tray è collegato ma la stampa non è andata a buon fine.\n\n' +
        'Se è comparsa una finestrella "Action Required" di QZ Tray e non hai fatto in tempo a cliccare "Allow", riprova: questa volta tieni il mouse pronto e clicca Allow appena compare, spuntando anche "Remember this decision" così capiterà solo questa volta.\n\n' +
        'Dettaglio tecnico: ' + (e && e.message ? e.message : e)
      );
      return; // non torniamo al browser: sappiamo già che su questo PC non stampa
    }
  }

  const area = document.getElementById('printArea');
  let html = '';
  if(tipo === 'cucina' || tipo === 'entrambe') html += htmlComandaCucina(ordine);
  if(tipo === 'entrambe') html += '<div class="print-pagebreak"></div>';
  if(tipo === 'cliente' || tipo === 'entrambe') html += htmlScontrinoCliente(ordine);
  area.innerHTML = html;
  window.print();
}

document.getElementById('sendCucinaBtn').addEventListener('click', async () => {
  const ordine = finalizzaOrdine();
  if(ordine) await stampaOrdine('cucina', ordine);
});
document.getElementById('sendClienteBtn').addEventListener('click', async () => {
  const ordine = finalizzaOrdine();
  if(ordine) await stampaOrdine('cliente', ordine);
});
document.getElementById('sendEntrambeBtn').addEventListener('click', async () => {
  const ordine = finalizzaOrdine();
  if(ordine) await stampaOrdine('entrambe', ordine);
});

// ---------------------------------------------------------------------
// MODIFICA DI UN ORDINE GIÀ INVIATO
// ---------------------------------------------------------------------
function enterEditMode(numero){
  const ordine = openOrders.find(o => o.numero === numero);
  if(!ordine) return;

  editingOrderNumber = numero;
  currentOrder = ordine.voci.map(v => ({ lineId: nextLineId++, catId: v.catId, qty: v.qty, extra: v.extra || null, prezzoManuale: (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : undefined }));

  document.getElementById('orderPanelTitle').textContent = `Modifica ordine N.${String(numero).padStart(3,'0')}`;

  const banner = document.getElementById('editBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>Stai aggiungendo prodotti all'ordine N.${String(numero).padStart(3,'0')}</span><button id="annullaModificaBtn">Annulla</button>`;
  document.getElementById('annullaModificaBtn').addEventListener('click', uscitaModalitaModifica);

  renderCurrent();
}

function uscitaModalitaModifica(){
  editingOrderNumber = null;
  currentOrder = [];
  document.getElementById('orderPanelTitle').textContent = 'Ordine in corso';
  document.getElementById('editBanner').style.display = 'none';
  renderCurrent();
}

// ---------------------------------------------------------------------
// BOARD ORDINI APERTI + evidenziazione oltre 15 minuti
// ---------------------------------------------------------------------
function renderBoard(){
  const board = document.getElementById('board');
  if(openOrders.length === 0){
    board.innerHTML = '<div class="board-empty">Nessun ordine aperto al momento.</div>';
    salvaStato();
    return;
  }
  board.innerHTML = openOrders.map(o => {
    const minuti = (Date.now() - o.orario.getTime()) / 60000;
    const late = minuti > 15;
    return `
      <div class="order-card ${late ? 'late' : ''}" data-numero="${o.numero}">
        <span class="num">N.${String(o.numero).padStart(3,'0')}</span>
        <span class="elapsed">${late ? '⚠️' : ''} ${Math.floor(minuti)}′ · ${fmtEuro(o.totale)}</span>
        <button class="edit-btn" data-numero="${o.numero}" title="Aggiungi prodotti">✎</button>
        <button class="close-btn" data-numero="${o.numero}" title="Ordine servito">✔</button>
      </div>`;
  }).join('');
  board.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => enterEditMode(parseInt(btn.dataset.numero)));
  });
  board.querySelectorAll('.close-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const n = parseInt(btn.dataset.numero);
      openOrders = openOrders.filter(o => o.numero !== n);
      if(editingOrderNumber === n) uscitaModalitaModifica();
      renderBoard();
    });
  });
  salvaStato();
}

setInterval(renderBoard, 15000); // aggiorna i tempi trascorsi ogni 15 secondi

// ---------------------------------------------------------------------
// MICROFONO BREVE — usato solo per dettare la variazione di UNA riga alla
// volta (es. "senza origano"). Non aggiunge prodotti: quelli si scelgono
// sempre dai tasti del menù.
// ---------------------------------------------------------------------
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function dettaBreve(onStart, onRisultato, onFine){
  if(!SpeechRec){
    alert('Il riconoscimento vocale non è supportato su questo browser. Prova con Chrome o Edge.');
    return;
  }
  const rec = new SpeechRec();
  rec.lang = 'it-IT';
  rec.continuous = false;
  rec.interimResults = false;

  rec.addEventListener('start', () => { if(onStart) onStart(); });
  rec.addEventListener('result', (event) => {
    const testo = event.results[0][0].transcript;
    if(onRisultato) onRisultato(testo);
  });
  rec.addEventListener('end', () => { if(onFine) onFine(); });
  rec.addEventListener('error', () => { if(onFine) onFine(); });

  try{ rec.start(); } catch(e){ /* già in ascolto */ }
}

// ---------------------------------------------------------------------
caricaStato();
renderMenu();
renderCurrent();
renderBoard();

(async () => {
  const stato = document.getElementById('qzStatus');

  if(ok){
    stato.textContent = '✔ QZ Tray collegato — stampa diretta alla BIXOLON';
    stato.className = 'qz-status ok';
  } else {
    stato.textContent = '⚠ QZ Tray non trovato — userò la finestra di stampa del browser come riserva';
    stato.className = 'qz-status no';
  }
})();
