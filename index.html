<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soufflé Comande</title>
  <style>
    :root {
      --bg: #121214;
      --panel-bg: #1a1a1e;
      --accent: #ff6b00;
      --text: #ffffff;
      --text-dim: #a0a0aa;
      --border: #2a2a30;
      --green: #2e7d32;
      --red: #c62828;
      --gold: #f57f17;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }

    /* PANNELLO SCONTRINO (SINISTRA) */
    .receipt-panel {
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .receipt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .active-table-badge {
      background: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .order-items {
      flex: 1;
      overflow-y: auto;
      margin: 15px 0;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .receipt-footer {
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-save { background: #333; color: #fff; }
    .btn-print { background: var(--accent); color: #fff; }

    /* PANNELLO PRODOTTI E TAVOLI (DESTRA) */
    .menu-panel { display: flex; flex-direction: column; height: 100vh; }

    .categories-bar {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .cat-btn {
      padding: 12px 20px;
      background: #25252b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-btn.active { background: var(--accent); border-color: var(--accent); }

    .grid-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      align-content: start;
    }

    /* TAVOLI GRANDI */
    .table-card {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s;
    }

    .table-card:active { transform: scale(0.96); }

    .table-free { background: var(--green); color: #fff; }
    .table-busy { background: var(--red); color: #fff; }
    .table-editing { background: var(--gold); color: #000; border-color: #fff; }

    .table-number { font-size: 1.8rem; font-weight: bold; }
    .table-info { font-size: 0.85rem; margin-top: 5px; opacity: 0.9; }

    /* PRODOTTI */
    .product-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 110px;
      cursor: pointer;
    }

    .product-card:active { background: #25252b; }
    .product-name { font-weight: bold; font-size: 1rem; }
    .product-price { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

<div class="app">
  <!-- PANNELLO SCONTRINO (SINISTRA) -->
  <div class="receipt-panel">
    <div class="receipt-header">
      <h2>Scontrino</h2>
      <span class="active-table-badge" id="activeTableLabel">Tavolo 1</span>
    </div>

    <div class="order-items" id="orderItems">
      <!-- I prodotti aggiunti compariranno qui -->
    </div>

    <div class="receipt-footer">
      <div class="total-row">
        <span>Totale</span>
        <span id="totalAmount">€ 0.00</span>
      </div>
      <button class="action-btn btn-save" onclick="salvaSospeso()">📌 Salva Sospeso</button>
      <button class="action-btn btn-print" onclick="stampaComanda()">🖨️ Stampa Comanda</button>
    </div>
  </div>

  <!-- PANNELLO PRODOTTI / TAVOLI (DESTRA) -->
  <div class="menu-panel">
    <div class="categories-bar">
      <button class="cat-btn active" onclick="mostraSezione('tavoli')">🍽️ TAVOLI</button>
      <button class="cat-btn" onclick="mostraSezione('pizze')">🍕 Pizze</button>
      <button class="cat-btn" onclick="mostraSezione('friggitoria')">🍟 Friggitoria</button>
      <button class="cat-btn" onclick="mostraSezione('bibite')">🥤 Bibite</button>
    </div>

    <div class="grid-container" id="gridContainer">
      <!-- Contenuto dinamico (Tavoli o Prodotti) -->
    </div>
  </div>
</div>

<script>
  // Stato Applicazione
  let tavoloSelezionato = 1;
  let sezioni = {
    tavoli: true,
    categoriaCorrente: 'tavoli'
  };

  let comandeSospese = {
    1: [], 2: [], 3: [], 4: [], 5: [], 6: []
  };

  const prodotti = {
    pizze: [
      { nome: 'Margherita', prezzo: 5.00 },
      { nome: 'Diavola', prezzo: 6.50 },
      { nome: 'Capricciosa', prezzo: 7.50 }
    ],
    friggitoria: [
      { nome: 'Patatine', prezzo: 3.00 },
      { nome: 'Arancino', prezzo: 2.00 },
      { nome: 'Crocchè', prezzo: 1.50 }
    ],
    bibite: [
      { nome: 'Acqua 0.5L', prezzo: 1.00 },
      { nome: 'Coca Cola', prezzo: 2.50 },
      { nome: 'Birra 33cl', prezzo: 3.00 }
    ]
  };

  function inizializza() {
    mostraSezione('tavoli');
    aggiornaScontrino();
  }

  function mostraSezione(cat) {
    sezioni.categoriaCorrente = cat;
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    
    // Attiva il pulsante corretto
    const btnAttivo = Array.from(document.querySelectorAll('.cat-btn'))
      .find(b => b.textContent.toLowerCase().includes(cat));
    if(btnAttivo) btnAttivo.classList.add('active');

    const container = document.getElementById('gridContainer');
    container.innerHTML = '';

    if (cat === 'tavoli') {
      renderTavoli(container);
    } else {
      renderProdotti(container, cat);
    }
  }

  function renderTavoli(container) {
    for (let i = 1; i <= 6; i++) {
      const items = comandeSospese[i];
      const haComanda = items.length > 0;
      const isSelezionato = i === tavoloSelezionato;

      let statoClasse = 'table-free';
      if (isSelezionato) statoClasse = 'table-editing';
      else if (haComanda) statoClasse = 'table-busy';

      const totale = items.reduce((acc, item) => acc + item.prezzo, 0);

      const card = document.createElement('div');
      card.className = `table-card ${statoClasse}`;
      card.onclick = () => selezionaTavolo(i);
      card.innerHTML = `
        <div class="table-number">Tavolo ${i}</div>
        <div class="table-info">${haComanda ? items.length + ' art. - €' + totale.toFixed(2) : 'Libero'}</div>
      `;
      container.appendChild(card);
    }
  }

  function renderProdotti(container, cat) {
    prodotti[cat].forEach(prod => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.onclick = () => aggiungiProdotto(prod);
      card.innerHTML = `
        <div class="product-name">${prod.nome}</div>
        <div class="product-price">€ ${prod.prezzo.toFixed(2)}</div>
      `;
      container.appendChild(card);
    });
  }

  function selezionaTavolo(num) {
    tavoloSelezionato = num;
    document.getElementById('activeTableLabel').textContent = `Tavolo ${num}`;
    if (sezioni.categoriaCorrente === 'tavoli') mostraSezione('tavoli');
    aggiornaScontrino();
  }

  function aggiungiProdotto(prod) {
    comandeSospese[tavoloSelezionato].push(prod);
    aggiornaScontrino();
  }

  function aggiornaScontrino() {
    const container = document.getElementById('orderItems');
    container.innerHTML = '';
    const lista = comandeSospese[tavoloSelezionato];

    lista.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'order-item';
      row.innerHTML = `
        <span>${item.nome}</span>
        <span>€ ${item.prezzo.toFixed(2)}</span>
      `;
      container.appendChild(row);
    });

    const totale = lista.reduce((acc, item) => acc + item.prezzo, 0);
    document.getElementById('totalAmount').textContent = `€ ${totale.toFixed(2)}`;
  }

  function salvaSospeso() {
    mostraSezione('tavoli');
  }

  function stampaComanda() {
    if (comandeSospese[tavoloSelezionato].length === 0) return;
    alert(`Stampa in corso per Tavolo ${tavoloSelezionato}`);
    comandeSospese[tavoloSelezionato] = [];
    aggiornaScontrino();
    mostraSezione('tavoli');
  }

  inizializza();
</script>

</body>
</html>
