<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Soufflé — Comande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood: #2B2118;
    --wood-light: #3D2F22;
    --wood-lighter: #4C3B2A;
    --paper: #F7F1E1;
    --paper-dim: #EDE4CC;
    --ink: #201A12;
    --ink-soft: #6b5f4d;
    --ember: #D94F2B;
    --ember-dark: #B33E20;
    --basil: #7A9471;
    --gold: #C89B3C;
    --line: #5a4a37;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--wood);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 60%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 80px);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header{
    padding: 20px 28px 16px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 10px;
  }
  header h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: 1px;
    margin:0;
    color: var(--paper);
  }
  header h1 span{ color: var(--ember); }
  header .tag{
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    color: #a8977d;
  }

  .top-fisso{
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--wood);
    padding-bottom: 10px;
    box-shadow: 0 8px 14px -6px rgba(0,0,0,0.5);
  }
  .top-fisso .board{ margin-top: 8px; }

  main{
    display:flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 18px;
    padding: 6px 28px 10px;
  }
  @media (max-width: 900px){
    main{ flex-direction: column; }
  }

  .panel{
    background: var(--wood-light);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
  }
  .panel.order-panel{
    flex: 0 0 460px;
    max-width: 380px;
    padding: 0;
    position: sticky;
    top: 68px; /* appena sotto la bacheca ordini aperti, che resta fissa in alto (ridotto perché il titolo è stato tolto) */
    max-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* lo scroll avviene dentro .order-scroll, i pulsanti restano fissi */
  }
  @media (max-width: 900px){
    .panel.order-panel{ position: static; max-width: 100%; max-height: 58vh; }
  }
  .order-scroll{
    overflow-y: auto;
    padding: 0 14px 4px;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #receiptView{ flex: 1; }
  .order-fisso{
    flex-shrink: 0;
    padding: 8px 14px 0;
  }
  .order-panel .send-row{
    flex-shrink: 0;
    margin: 0; padding: 8px 14px;
    background: var(--wood-light);
    border-top: 1px solid var(--line);
  }
  .panel.order-panel h2{ font-size: 16px; margin-bottom: 6px; }
  .panel.menu-panel{
    flex: 1;
    min-width: 0;
    padding: 0;
    position: sticky;
    top: 68px;
    max-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* lo scroll avviene dentro .menu-scroll, i campi e le pagine restano fissi */
  }
  @media (max-width: 900px){
    .panel.menu-panel{ position: static; max-height: none; }
  }
  .menu-fisso{
    flex-shrink: 0;
    background: var(--wood-light);
    padding: 8px 18px 8px;
    border-bottom: 1px solid var(--line);
  }
  .menu-scroll{
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
  }
  #menu{ padding: 8px 18px 18px; }
  .panel h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.5px;
    margin: 0 0 12px;
    color: var(--gold);
    text-transform: uppercase;
  }

  .cat-block + .cat-block{ margin-top: 16px; }

  .menu-pagine{ display:flex; align-items:center; gap:8px; margin-bottom:0; flex-wrap:wrap; }
  .quantita-separatore{ width:1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .quantita-tasti{ display:flex; gap: 8px; flex-wrap: wrap; }
  .quantita-tasto{
    width: 46px; height: 46px; border-radius: 10px; border: 2px solid #4a90d9;
    background: #1f3a52; color: #bfe0ff; font-size: 19px; font-weight:800; cursor:pointer;
  }
  .quantita-tasto.active{ background: #4a90d9; border-color: #4a90d9; color: #08202f; }
  .pagina-tab{
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--wood-lighter); color: var(--paper); cursor:pointer;
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:15px;
    letter-spacing: 0.3px;
  }
  .pagina-tab.active{ background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .cat-title{
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #a8977d;
    margin-bottom: 10px;
    font-weight: 700;
  }
  .btn-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  @media (max-width: 900px){
    .btn-grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px){
    .btn-grid{ grid-template-columns: repeat(1, 1fr); }
  }
  .item-btn{
    background: var(--wood-lighter);
    border: 1px solid var(--line);
    border-left: 5px solid var(--cat-color, var(--gold));
    color: var(--paper);
    border-radius: 8px;
    padding: 16px 16px;
    min-height: 100px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .item-btn:hover{ background: #5a4732; }
  .item-btn:active{ transform: scale(0.97); }
  .item-btn .name{ display:block; font-weight:700; font-size: 20px; line-height: 1.25; }
  .item-btn .price{ display:block; font-size: 18px; color: var(--cat-color, var(--gold)); margin-top: 6px; font-weight:600; font-family:'IBM Plex Mono', monospace; }

  .item-btn-menu{
    background: #2f4a3a;
    border: 1px solid #4caf7d;
    border-left: 5px solid #4caf7d;
  }
  .item-btn-menu:hover{ background: #3a5c48; }
  .item-btn-menu .price{ color: #7fe0ab; }

  .item-btn-verde{ background: #2f4a3a; border: 1px solid #4caf7d; }
  .item-btn-verde:hover{ background: #3a5c48; }
  .item-btn-verde .price{ color: #7fe0ab; }

  .item-btn-verde-chiaro{ background: #3f6b4a; border: 1px solid #7fd996; }
  .item-btn-verde-chiaro:hover{ background: #4d7d58; }
  .item-btn-verde-chiaro .price{ color: #a8f0bd; }

  /* Pulsanti con foto prodotto: miniatura a sinistra, nome sopra e prezzo sotto a destra */
  .item-btn-foto{
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    min-height: 200px;
  }
  .item-thumb{
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .item-btn-foto .item-text{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .item-btn-foto .name{
    font-size: 26px;
    line-height: 1.25;
    overflow-wrap: break-word;
  }
  .item-btn-foto .price{
    font-size: 22px;
    margin-top: 0;
  }

  .item-btn-giallo{ background: #4a4222; border: 1px solid #d4b83a; }
  .item-btn-giallo:hover{ background: #5c5329; }
  .item-btn-giallo .price{ color: #e8d478; }

  .item-btn-rosso{ background: #4a2320; border: 1px solid #c0453b; }
  .item-btn-rosso:hover{ background: #5c2b27; }
  .item-btn-rosso .price{ color: #e8837a; }

  .item-btn-bianco{ background: #eae3d3; border: 1px solid #cfc4a8; }
  .item-btn-bianco:hover{ background: #ded4bd; }
  .item-btn-bianco .name{ color: #2a2118; }
  .item-btn-bianco .price{ color: #2a2118; }

  /* ORDER IN PROGRESS */
  .current-list{ min-height: 40px; margin-bottom: 14px; }
  .current-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 18px;
  }
  .current-row .qty-controls{ display:flex; align-items:center; gap:10px; }
  .current-row button.step{
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--wood-lighter); color: var(--paper); cursor:pointer; font-size: 19px; line-height: 1;
  }
  .current-row .qty{ font-family:'IBM Plex Mono', monospace; min-width: 22px; text-align:center; font-size: 18px; }
  .current-row button.price-tag{
    border: 1px solid var(--gold); background: transparent; color: var(--gold);
    border-radius: 8px; padding: 6px 12px; font-size: 17px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
  }
  .current-row button.price-tag:hover{ background: var(--gold); color: var(--ink); }
  .current-row button.remove-line{
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: #a8756a; cursor:pointer; font-size: 17px; line-height: 1;
  }
  .current-row button.remove-line:hover{ background: var(--ember); border-color: var(--ember); color: var(--paper); }
  .current-row button.edit-note{
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--wood-lighter); color: var(--paper); cursor:pointer; font-size: 17px; line-height: 1;
  }
  .current-row button.edit-note:hover{ background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .empty-hint{ color:#8a7c65; font-size: 13px; font-style: italic; padding: 8px 0; }

  .qz-status{ font-size: 11px; color:#a8977d; padding: 6px 14px 0; }
  .qz-status.ok{ color: var(--basil); }
  .qz-status.no{ color: var(--gold); }
  .send-row{ display:flex; gap:8px; margin-top:14px; }
  .send-btn{
    flex: 1;
    background: var(--ember);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 14px 8px;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .send-btn.small{ background: var(--wood-lighter); border: 1px solid var(--ember); }
  .send-btn.sospeso-btn{ border-color: var(--gold); color: var(--gold); background: var(--wood-lighter); }
  .send-btn.sospeso-btn:hover{ background: var(--gold); color: var(--ink); }
  .send-btn.annulla-ordine-btn{ border-color: #c0392b; color: #e57368; background: var(--wood-lighter); }
  .send-btn.annulla-ordine-btn:hover{ background: #c0392b; color: #fff; }
  .send-btn:hover{ background: var(--ember-dark); }
  .send-btn.small:hover{ background: var(--ember); }
  .send-btn:disabled{ background:#5a4a37; border-color:#5a4a37; cursor:not-allowed; }

  /* STAMPA: nasconde tutto tranne il contenuto scelto, in bianco e nero */
  .print-only{ display:none; }
  @media print{
    @page{ margin: 2mm; }
    body *{ visibility: hidden; }
    #printArea, #printArea *{ visibility: visible; }
    #printArea{
      display:block !important;
      position:absolute; top:0; left:0;
      width: 280px; /* larghezza fissa adatta a una stampante da scontrini (~72-80mm) */
      max-width: 100%;
      background:#fff; color:#000;
    }
    #printArea .receipt{
      background:#fff; color:#000; box-shadow:none; clip-path:none;
      font-family:'IBM Plex Mono', monospace; font-size:13px; padding:0 0 20px;
      width: 100%; box-sizing: border-box;
    }
    #printArea .r-row{ flex-wrap: wrap; }
    #printArea .r-note{ color:#333; }
    #printArea .print-pagebreak{ page-break-after: always; }
  }

  /* RECEIPT PREVIEW TABS */
  .tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .tab{
    flex:1; text-align:center; padding: 8px; border-radius: 6px;
    background: var(--wood-lighter); color:#c9bda3; cursor:pointer;
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid var(--line);
  }
  .tab.active{ background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight:600; }

  .receipt{
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    padding: 18px 16px 26px;
    position: relative;
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 96%,
      95% 100%, 90% 96%, 85% 100%, 80% 96%, 75% 100%, 70% 96%, 65% 100%,
      60% 96%, 55% 100%, 50% 96%, 45% 100%, 40% 96%, 35% 100%, 30% 96%,
      25% 100%, 20% 96%, 15% 100%, 10% 96%, 5% 100%, 0% 96%
    );
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }
  .receipt .r-head{ text-align:center; font-weight:800; font-size: 30px; margin-bottom:2px; }
  .receipt .r-data{ text-align:center; font-size: 12px; color: var(--ink-soft); margin-bottom:4px; }
  .receipt .r-cliente{ text-align:center; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .receipt .r-ritiro{ text-align:center; font-size: 15px; font-weight:800; color: var(--ember-dark); margin-bottom: 6px; }
  .receipt .r-meta{ text-align:center; font-size:11px; color: var(--ink-soft); margin-bottom:10px; }
  .receipt hr{ border:none; border-top: 1px dashed var(--ink-soft); margin: 8px 0; }
  .receipt .r-cat{ font-weight:700; margin: 10px 0 4px; }
  .receipt .r-row{ display:flex; flex-wrap:wrap; align-items:center; gap: 4px 10px; padding: 6px 0; }
  .receipt .r-row-controls{ display:flex; align-items:center; gap: 6px; flex-shrink:0; flex-basis:100%; justify-content:flex-start; }
  .receipt button.r-step{
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--ink-soft);
    background: transparent; color: var(--ink); cursor:pointer; font-size: 14px; line-height:1;
  }
  .receipt .r-qty{ font-family:'IBM Plex Mono', monospace; min-width:16px; text-align:center; color: var(--ink); }
  .receipt button.r-price-tag{
    border: 1px solid var(--ink-soft); background: transparent; color: var(--ink);
    border-radius: 8px; padding: 6px 10px; font-size: 15px; font-weight:700; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
  }
  .receipt button.r-edit-note, .receipt button.r-remove-line{
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--ink-soft);
    background: transparent; color: var(--ink); cursor:pointer; font-size: 14px; line-height:1;
  }
  .receipt button.r-remove-line{ color:#a8756a; border-color:#a8756a; }
  .receipt .r-editing-row{ padding: 8px 0; border-top: 1px dashed var(--ink-soft); border-bottom: 1px dashed var(--ink-soft); }
  .receipt .r-editing-label{ font-weight:600; margin-bottom:6px; }
  .receipt .r-editing-controls{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .receipt .r-editing-controls input{
    flex:1; padding:6px 8px; border-radius:6px; border:1px solid var(--ink-soft); font-size:13px;
  }
  .receipt .r-editing-actions{ display:flex; gap:8px; }
  .receipt .r-editing-actions button{
    border:1px solid var(--ink-soft); background:transparent; color:var(--ink);
    border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer;
  }
  .receipt .r-note{ padding-left: 14px; color: var(--ink-soft); font-size: 12px; }
  .receipt .r-total{ display:flex; justify-content:space-between; font-weight:700; font-size:15px; margin-top:8px; }
  .receipt .r-empty{ text-align:center; color: var(--ink-soft); padding: 20px 0; font-style: italic; }

  /* Comanda cucina a schermo: caratteri più grandi per leggerla meglio da lontano */
  #receiptView.vista-cucina .receipt{ font-size: 21px; padding: 22px 20px 30px; }
  #receiptView.vista-cucina .r-head{ font-size: 36px; }
  #receiptView.vista-cucina .r-data{ font-size: 14px; }
  #receiptView.vista-cucina .r-cat{ font-size: 19px; margin: 14px 0 6px; }
  #receiptView.vista-cucina .r-row{ padding: 4px 0; }
  #receiptView.vista-cucina .r-note{ font-size: 15px; }

  /* OPEN ORDERS BOARD */
  .board{
    margin: 0 28px 6px;
    padding: 16px 20px;
    background: var(--wood-lighter);
    border: 1px solid var(--gold);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .board h2{ display: none; } /* etichetta generica nascosta di default... */
  .board h2.board-titolo{ display: block; } /* ...tranne i titoli espliciti che abbiamo aggiunto (Ordini aperti / Ritiri programmati) */
  .board-ritiri{ border-color: var(--ember); }
  .board-ritiri .board-titolo{ color: var(--ember); }
  .ritiro-countdown{ font-size: 13px; color:#c9bda3; }
  .board-grid{
    flex: 1;
    display:flex; flex-direction: row; flex-wrap: nowrap;
    gap: 12px; overflow-x: auto; padding-bottom: 2px;
  }
  .resoconto-btn{
    flex-shrink: 0;
    width: 46px; height: 46px;
    border-radius: 10px;
    border: 1px solid var(--gold);
    background: var(--wood);
    color: var(--gold);
    font-size: 22px;
    cursor: pointer;
  }
  .resoconto-btn:hover{ background: var(--gold); color: var(--ink); }
  .resoconto-overlay{
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 200; display:flex; align-items:center; justify-content:center;
  }
  .resoconto-box{
    background: var(--wood-lighter);
    border: 1px solid var(--gold);
    border-radius: 14px;
    width: min(720px, 92vw);
    max-height: 86vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .resoconto-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  .resoconto-head h2{ margin:0; font-family:'Big Shoulders Display', sans-serif; color: var(--gold); font-size: 24px; }
  .resoconto-close{
    background: transparent; border: 1px solid var(--line); color: var(--paper);
    width: 34px; height: 34px; border-radius: 8px; cursor:pointer; font-size: 16px;
  }
  .resoconto-tabs{ display:flex; gap: 10px; padding: 14px 24px 0; }
  .resoconto-tab{
    background: transparent; border: 1px solid var(--line); color: var(--paper);
    padding: 8px 16px; border-radius: 8px; cursor:pointer; font-size: 15px;
  }
  .resoconto-tab.active{ background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .resoconto-contenuto{ padding: 16px 24px 24px; overflow-y: auto; }
  .resoconto-riga{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 16px;
  }
  .resoconto-riga .nome{ color: var(--paper); }
  .resoconto-riga .qty{ color: var(--gold); font-family:'IBM Plex Mono', monospace; margin-right: 14px; }
  .resoconto-riga .subtot{ color:#c9bda3; font-family:'IBM Plex Mono', monospace; min-width:76px; text-align:right; }
  .resoconto-totale{
    display:flex; justify-content:space-between; margin-top: 14px; padding-top: 14px;
    border-top: 2px solid var(--gold); font-size: 19px; font-weight: 700; color: var(--gold);
  }
  .archivio-selettore{
    display:flex; align-items:center; gap: 10px; margin-bottom: 10px;
  }
  .archivio-selettore input[type="date"]{
    flex:1; padding: 10px 12px; border-radius: 8px; border:1px solid var(--line);
    background: var(--wood-lighter); color: var(--paper); font-size: 15px;
    font-family:'IBM Plex Mono', monospace;
  }
  .archivio-freccia{
    width: 40px; height: 40px; border-radius: 8px; border:1px solid var(--line);
    background: var(--wood-lighter); color: var(--paper); font-size: 16px; cursor:pointer;
  }
  .archivio-data-titolo{
    text-align:center; color: var(--gold); font-weight:700; text-transform: capitalize;
    margin-bottom: 14px; font-size: 15px;
  }
  .archivio-ordine{
    background: var(--wood-lighter); border:1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }

let nextLineId = 1;

let orarioRitiroCorrente = ''; // orario di ritiro (facoltativo, formato "HH:MM"), per ordini telefonici

const fmtEuro = n => '€' + n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtOra = d => d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
const fmtData = d => d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'2-digit'});
const prod = catId => CATALOGO.find(p => p.id === catId);
// Una riga può avere più "gusti"/variazioni separate da a-capo (es. i due
// gusti di un Mezzo Metro Farcito): questa funzione le separa in un elenco,
// scartando righe vuote.
const righeExtra = extra => (extra || '').split('\n').map(s => s.trim()).filter(Boolean);

// ---------------------------------------------------------------------
// MEMORIA LOCALE — tiene traccia degli ordini anche ricaricando la pagina.
// Si azzera automaticamente a ogni nuovo giorno (il numero riparte da 1).
// ---------------------------------------------------------------------
const CHIAVE_STATO = 'souffle_stato_v2';
const oggiStr = () => new Date().toDateString();

function salvaStato(){
  try{
    const stato = {
      giorno: oggiStr(),
      orderCounter,
      nextLineId,
      openOrders: openOrders.map(o => ({ ...o, orario: o.orario.toISOString() })),
      currentOrder,
      editingOrderNumber,
      nomeClienteCorrente,
      tavoloCorrente,
      orarioRitiroCorrente,
      noteOrdineCorrente
    };
    localStorage.setItem(CHIAVE_STATO, JSON.stringify(stato));
  } catch(e){ /* memoria locale non disponibile: l'app funziona comunque, solo senza salvataggio */ }
}

function caricaStato(){
  try{
    const raw = localStorage.getItem(CHIAVE_STATO);
    if(!raw) return;
    const stato = JSON.parse(raw);
    if(stato.giorno !== oggiStr()) return; // nuovo giorno: si riparte puliti

    orderCounter = stato.orderCounter || 0;
    nextLineId = stato.nextLineId || 1;
    openOrders = (stato.openOrders || []).map(o => ({ ...o, orario: new Date(o.orario) }));
    currentOrder = stato.currentOrder || [];
    editingOrderNumber = (stato.editingOrderNumber === undefined) ? null : stato.editingOrderNumber;
    nomeClienteCorrente = stato.nomeClienteCorrente || '';
    tavoloCorrente = (stato.tavoloCorrente !== undefined && stato.tavoloCorrente !== null) ? stato.tavoloCorrente : null;
    orarioRitiroCorrente = stato.orarioRitiroCorrente || '';
    noteOrdineCorrente = stato.noteOrdineCorrente || '';

    // Scarta eventuali righe che fanno riferimento a prodotti non più
    // presenti nel catalogo (es. dopo un aggiornamento del menù), così
    // un vecchio ordine salvato non manda in errore tutta la pagina.
    currentOrder = currentOrder.filter(l => !!prod(l.catId));
    openOrders.forEach(o => {
      o.voci = (o.voci || []).filter(v => !!prod(v.catId));
      o.totale = o.voci.reduce((sum, v) => {
        const prezzo = (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : prod(v.catId).price;
        return sum + prezzo * v.qty;
      }, 0);
    });
    openOrders = openOrders.filter(o => o.voci.length > 0);
  } catch(e){ /* niente da recuperare */ }
}

      if(farciscendoLineId !== null && (p.category === '🍕 Pizze rosse' || p.category === '🧀 Pizze bianche')){

function iniziaSceltaGusti(lineId, quantiGusti, nomeProdotto){

}

function terminaScelteGusti(){
  farciscendoLineId = null;
  farciscendoGusti = [];
  const banner = document.getElementById('editBanner');
  if(editingOrderNumber === null){ // se non siamo anche in modifica di un altro ordine, nascondi il banner
    banner.style.display = 'none';
    banner.innerHTML = '';
  }
}

// ---------------------------------------------------------------------
// GESTIONE RIGHE ORDINE (con supporto a varianti/note libere)
// ---------------------------------------------------------------------
// Aggiunge una quantità di un prodotto all'ordine in corso. Se esiste già
// una riga con lo stesso prodotto E la stessa nota libera, le quantità si
// sommano (unione automatica); altrimenti si crea una nuova riga.
function aggiungiRiga(catId, qty, extra){
  const norm = extra ? extra.trim().toLowerCase() : null;
  const linea = currentOrder.find(l => l.catId === catId && (l.extra || null) === norm);
  if(linea){
    linea.qty += qty;
  } else {
    currentOrder.push({ lineId: nextLineId++, catId, qty, extra: norm });
  }
}

function lineLabel(line){
  const p = prod(line.catId);
  let label = p.base;
  if(p.note) label += ' (' + p.note + ')';
  return label;
}

// Prezzo effettivo di una riga: quello corretto a mano se presente,
// altrimenti quello del catalogo. Utile per prodotti a gusto/prezzo
// variabile (es. arancini, frittatine) che cambiano ogni giorno.
// Include anche l'eventuale supplemento "mozzarella senza lattosio".
function prezzoLinea(line){
  const base = (line.prezzoManuale !== undefined && line.prezzoManuale !== null) ? line.prezzoManuale : prod(line.catId).price;
  return base + (line.supplLattosio || 0);
}

// Elenco delle note/variazioni di una riga da mostrare/stampare (variazione
// libera scritta/dettata + eventuale supplemento mozzarella senza lattosio).
function noteLinea(l){
  const note = righeExtra(l.extra);
  if(l.supplLattosio) note.push(`Mozzarella senza lattosio (+${fmtEuro(l.supplLattosio)})`);
  return note;
}
function noteLineaEsc(l){
  const note = righeExtra(l.extra);
  if(l.supplLattosio) note.push(`Mozzarella senza lattosio (+${fmtEuroEsc(l.supplLattosio)})`);
  return note;
}
// Come sopra ma senza il prezzo: per la comanda cucina, dove il prezzo del
// supplemento non serve (lo vede solo il cliente sullo scontrino).
function noteLineaCucina(l){
  const note = righeExtra(l.extra);
  if(l.supplLattosio) note.push('Mozzarella senza lattosio');
  return note;
}

function currentTotal(){
  return currentOrder.reduce((sum, l) => sum + prezzoLinea(l) * l.qty, 0);
}

            <span>${l.qty} ${prod(l.catId).base}${noteLinea(l).map(g => `<br><small style="color:var(--ink-soft);">${g}</small>`).join('')}</span>
            <div class="r-row-controls">
              <button class="r-price-tag" data-lineid="${l.lineId}" title="Tocca per correggere il prezzo">${fmtEuro(prezzoLinea(l))}</button>
              ${cat !== '🍺 Bevande' ? `
              ${l.supplLattosio ? `<button class="r-lattosio-meno" data-lineid="${l.lineId}" title="Togli 1€">−1€</button>` : ''}
              <button class="r-lattosio-btn r-lattosio-btn-riga ${l.supplLattosio ? 'attivo' : ''}" data-lineid="${l.lineId}" title="Tocca per aggiungere 1€ di supplemento mozzarella senza lattosio">🥛${l.supplLattosio ? `+${l.supplLattosio}€` : '+1€'}</button>` : ''}
              <button class="r-edit-note" data-lineid="${l.lineId}" title="Aggiungi/modifica variazione">✎</button>
              <button class="r-step" data-lineid="${l.lineId}" data-delta="-1">−</button>
              <span class="r-qty">${l.qty}</span>
              <button class="r-step" data-lineid="${l.lineId}" data-delta="1">+</button>
              <button class="r-remove-line" data-lineid="${l.lineId}" title="Elimina questa voce">🗑</button>
            </div>
          </div>`;
        }).join('')}
      `).join('')}
    </div>`;
}

function collegaControlliEditabili(view){
  view.querySelectorAll('.r-step').forEach(btn => {
    btn.addEventListener('click', () => {
      const lineId = parseInt(btn.dataset.lineid);
      const delta = parseInt(btn.dataset.delta);
      const linea = currentOrder.find(l => l.lineId === lineId);
      if(linea){
        linea.qty = Math.max(0, linea.qty + delta);
        if(linea.qty === 0) currentOrder = currentOrder.filter(l => l.lineId !== lineId);
      }
      renderCurrent();
    });
  });
  view.querySelectorAll('.r-remove-line').forEach(btn => {
    btn.addEventListener('click', () => {
      const lineId = parseInt(btn.dataset.lineid);
      currentOrder = currentOrder.filter(l => l.lineId !== lineId);
      renderCurrent();
    });
  });
  view.querySelectorAll('.r-price-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      apriPrezzoOverlay(parseInt(btn.dataset.lineid));
    });
  });
  view.querySelectorAll('.r-edit-note').forEach(btn => {
    btn.addEventListener('click', () => {
      editandoLineId = parseInt(btn.dataset.lineid);
      renderCurrent();
    });
  });
  view.querySelectorAll('.save-note-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const lineId = parseInt(btn.dataset.lineid);
      const linea = currentOrder.find(l => l.lineId === lineId);
      const input = document.getElementById('editNoteInput');
      if(linea && input) linea.extra = input.value.trim() || null;
      editandoLineId = null;
      renderCurrent();
    });
  });
  view.querySelectorAll('.cancel-note-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      editandoLineId = null;
      renderCurrent();
    });
  });
  view.querySelectorAll('.r-lattosio-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const lineId = parseInt(btn.dataset.lineid);
      const linea = currentOrder.find(l => l.lineId === lineId);
      if(!linea) return;
      // Ogni tocco aggiunge 1€ in più al supplemento (1°, 2°, 3° tocco = +1€, +2€, +3€...)
      linea.supplLattosio = (linea.supplLattosio || 0) + 1;
      renderCurrent();
    });
  });
  view.querySelectorAll('.r-lattosio-meno').forEach(btn => {
    btn.addEventListener('click', () => {
      const lineId = parseInt(btn.dataset.lineid);
      const linea = currentOrder.find(l => l.lineId === lineId);
      if(!linea) return;
      // Toglie 1€ alla volta, per correggere se si è cliccato troppe volte per sbaglio
      linea.supplLattosio = Math.max(0, (linea.supplLattosio || 0) - 1);
      renderCurrent();
    });
  });
  const micNota = document.getElementById('editNoteMic');
  if(micNota){
    micNota.addEventListener('click', () => {
      dettaBreve(
        () => { micNota.classList.add('listening'); micNota.textContent = '●'; },
        (testo) => {
          micNota.classList.remove('listening'); micNota.textContent = '🎤';
          const input = document.getElementById('editNoteInput');
          if(input && testo) input.value = testo;
        },
        () => { micNota.classList.remove('listening'); micNota.textContent = '🎤'; }
      );
    });
  }
}

// ---------------------------------------------------------------------
// INVIO ORDINE / AGGIORNAMENTO ORDINE ESISTENTE + ANNUNCIO VOCALE + STAMPA
// ---------------------------------------------------------------------

// Finalizza l'ordine in corso (nuovo o in modifica): lo salva, annuncia il
// totale a voce e restituisce l'oggetto ordine completo pronto per la stampa.
// Restituisce null se non c'è nulla da inviare.
// ---------------------------------------------------------------------
// STORICO VENDITE — a differenza dello stato giornaliero (che si azzera
// ogni giorno), questo registro resta salvato per sempre nel browser,
// giorno per giorno, e serve solo per i resoconti (oggi/mese). Non
// influisce mai sul funzionamento normale dell'app.
// ---------------------------------------------------------------------
const CHIAVE_STORICO = 'souffle_storico_vendite';
const chiaveGiorno = d => { // es. "2026-08-15", basata sulla data dell'ordine
  const iso = new Date(d).toISOString();
  return iso.slice(0,10);
};

function leggiStorico(){
  try{
    return JSON.parse(localStorage.getItem(CHIAVE_STORICO) || '{}');
  } catch(e){ return {}; }
}

function registraStorico(ordine){
  if(!ordine) return;
  try{
    const storico = leggiStorico();
    const giorno = chiaveGiorno(ordine.orario);
    if(!storico[giorno]) storico[giorno] = {};
    // Salviamo/aggiorniamo la voce per numero ordine: così se un ordine
    // viene modificato più tardi, il resoconto riflette sempre l'ultima
    // versione invece di contare due volte. Salviamo tutti i dati (non solo
    // voci/totale) così l'ordine si può anche riaprire e ristampare dall'archivio.
    storico[giorno][ordine.numero] = {
      voci: ordine.voci,
      totale: ordine.totale,
      orario: ordine.orario.toISOString(),
      tavolo: ordine.tavolo || null,
      nomeCliente: ordine.nomeCliente || null,
      orarioRitiro: ordine.orarioRitiro || null,
      noteOrdine: ordine.noteOrdine || null,
    };
    localStorage.setItem(CHIAVE_STORICO, JSON.stringify(storico));
  } catch(e){ /* storico non disponibile: il resoconto sarà solo incompleto, l'app funziona comunque */ }
}

// Calcola il resoconto (quantità e incasso per prodotto) sommando tutti
// i giorni compresi tra dataInizio e dataFine (incluse), formato "YYYY-MM-DD".
function calcolaResoconto(dataInizio, dataFine){
  const storico = leggiStorico();
  const perProdotto = {}; // nome prodotto -> {qty, subtot}
  let totaleGenerale = 0;

  Object.keys(storico).forEach(giorno => {
    if(giorno < dataInizio || giorno > dataFine) return;
    Object.values(storico[giorno]).forEach(ordine => {
      (ordine.voci || []).forEach(v => {
        const p = prod(v.catId);
        const nome = p ? p.base : '(prodotto rimosso dal catalogo)';
        const prezzo = (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : (p ? p.price : 0);
        if(!perProdotto[nome]) perProdotto[nome] = { qty:0, subtot:0 };
        perProdotto[nome].qty += v.qty;
        perProdotto[nome].subtot += prezzo * v.qty;
        totaleGenerale += prezzo * v.qty;
      });
    });
  });

  const righe = Object.entries(perProdotto)
    .map(([nome, dati]) => ({ nome, ...dati }))
    .sort((a,b) => b.qty - a.qty);

  return { righe, totaleGenerale };
}

function renderResoconto(periodo){
  if(periodo === 'archivio'){
    renderArchivioComande(chiaveGiorno(new Date()));
    return;
  }
  const oggi = new Date();
  const oggiKey = chiaveGiorno(oggi);
  let inizio, fine;
  if(periodo === 'mese'){
    inizio = oggiKey.slice(0,8) + '01'; // primo giorno del mese corrente
    fine = oggiKey;
  } else {
    inizio = fine = oggiKey;
  }

  const { righe, totaleGenerale } = calcolaResoconto(inizio, fine);
  const cont = document.getElementById('resocontoContenuto');

  if(righe.length === 0){
    cont.innerHTML = '<div class="resoconto-vuoto">Nessuna vendita registrata in questo periodo.</div>';
    return;
  }

  cont.innerHTML = righe.map(r => `
    <div class="resoconto-riga">
      <span class="nome">${r.nome}</span>
      <span>
        <span class="qty">×${r.qty}</span>
        <span class="subtot">${fmtEuro(r.subtot)}</span>
      </span>
    </div>
  `).join('') + `
    <div class="resoconto-totale">
      <span>Totale incasso</span>
      <span>${fmtEuro(totaleGenerale)}</span>
    </div>
  `;
}

// Elenco di tutte le comande (ordini completi, con i prodotti dentro) di un
// giorno scelto, per poter ricontrollare cosa è stato fatto in una data
// passata. Usa lo stesso storico salvato per il resoconto vendite.
let archivioOrdineApertoNumero = null; // numero dell'ordine aperto/espanso nell'archivio (uno alla volta)

function renderArchivioComande(dataISO){
  const cont = document.getElementById('resocontoContenuto');
  const storico = leggiStorico();
  const giorno = storico[dataISO] || {};
  const ordini = Object.entries(giorno)
    .map(([numero, dati]) => ({ numero: parseInt(numero), ...dati }))
    .sort((a, b) => a.numero - b.numero);

  const dataFormattata = new Date(dataISO + 'T12:00:00').toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  let html = `
    <div class="archivio-selettore">
      <button id="archivioGiornoPrima" class="archivio-freccia">◀</button>
      <input type="date" id="archivioGiornoInput" value="${dataISO}" max="${chiaveGiorno(new Date())}">
      <button id="archivioGiornoDopo" class="archivio-freccia">▶</button>
    </div>
    <div class="archivio-data-titolo">${dataFormattata}</div>
  `;

  if(ordini.length === 0){
    html += '<div class="resoconto-vuoto">Nessuna comanda registrata in questo giorno.</div>';
    cont.innerHTML = html;
    collegaEventiArchivio(dataISO);
    return;
  }

  const totaleGiorno = ordini.reduce((s, o) => s + o.totale, 0);

  html += ordini.map(o => {
    const aperto = o.numero === archivioOrdineApertoNumero;
    const righeProdottiCompatte = (o.voci || []).map(v => {
      const p = prod(v.catId);
      const nome = p ? p.base : '(prodotto rimosso)';
      return `${v.qty}× ${nome}`;
    }).join(', ');

    let dettaglio = '';
    if(aperto){
      const righeComplete = (o.voci || []).map(v => {
        const p = prod(v.catId);
        const nome = p ? p.base : '(prodotto rimosso)';
        const noteComplete = noteLinea(v);
        return `<div class="archivio-dettaglio-riga">
          <span>${v.qty}× ${nome}</span>
          <span>${fmtEuro(prezzoLinea(v) * v.qty)}</span>
        </div>${noteComplete.map(n => `<div class="archivio-dettaglio-nota">- ${n}</div>`).join('')}`;
      }).join('');
      const intestazione = [
        o.tavolo ? `Tavolo ${o.tavolo}` : null,
        o.nomeCliente || null,
        o.orarioRitiro ? `⏰ Ritiro ore ${o.orarioRitiro}` : null,
        o.noteOrdine ? `📝 ${o.noteOrdine}` : null,
      ].filter(Boolean).join(' · ');
      dettaglio = `
        <div class="archivio-dettaglio">
          ${intestazione ? `<div class="archivio-dettaglio-intestazione">${intestazione}</div>` : ''}
          ${righeComplete}
          <button class="archivio-ristampa-btn" data-data="${dataISO}" data-numero="${o.numero}">🖨️ Ristampa</button>
        </div>
      `;
    }

    return `
      <div class="archivio-ordine ${aperto ? 'aperto' : ''}">
        <div class="archivio-ordine-riga1 archivio-ordine-clic" data-numero="${o.numero}">
          <span class="archivio-numero">N.${String(o.numero).padStart(3,'0')} ${aperto ? '▲' : '▼'}</span>
          <span class="archivio-totale">${fmtEuro(o.totale)}</span>
        </div>
        <div class="archivio-ordine-prodotti">${righeProdottiCompatte}</div>
        ${dettaglio}
      </div>
    `;
  }).join('') + `
    <div class="resoconto-totale">
      <span>Totale incasso del giorno</span>
      <span>${fmtEuro(totaleGiorno)}</span>
    </div>
  `;

  cont.innerHTML = html;
  cont.querySelectorAll('.archivio-ordine-clic').forEach(el => {
    el.addEventListener('click', () => {
      const numero = parseInt(el.dataset.numero);
      archivioOrdineApertoNumero = (archivioOrdineApertoNumero === numero) ? null : numero;
      renderArchivioComande(dataISO);
    });
  });
  cont.querySelectorAll('.archivio-ristampa-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      ristampaOrdineArchiviato(btn.dataset.data, parseInt(btn.dataset.numero));
    });
  });
  collegaEventiArchivio(dataISO);
}

function ristampaOrdineArchiviato(dataISO, numero){
  const storico = leggiStorico();
  const dati = storico[dataISO] && storico[dataISO][numero];
  if(!dati) return;
  const ordineRicostruito = {
    numero,
    orario: new Date(dati.orario),
    voci: dati.voci,
    totale: dati.totale,
    tavolo: dati.tavolo || null,
    nomeCliente: dati.nomeCliente || null,
    orarioRitiro: dati.orarioRitiro || null,
    noteOrdine: dati.noteOrdine || null,
  };
  stampaOrdine('entrambe', ordineRicostruito);
}

function collegaEventiArchivio(dataISO){
  document.getElementById('archivioGiornoInput').addEventListener('change', (e) => {
    renderArchivioComande(e.target.value);
  });
  document.getElementById('archivioGiornoPrima').addEventListener('click', () => {
    const d = new Date(dataISO + 'T12:00:00');
    d.setDate(d.getDate() - 1);
    renderArchivioComande(chiaveGiorno(d));
  });
  document.getElementById('archivioGiornoDopo').addEventListener('click', () => {
    const d = new Date(dataISO + 'T12:00:00');
    d.setDate(d.getDate() + 1);
    if(chiaveGiorno(d) > chiaveGiorno(new Date())) return; // non si va nel futuro
    renderArchivioComande(chiaveGiorno(d));
  });
}

function finalizzaOrdine(){
  const righe = currentOrder.filter(l => l.qty > 0);
  if(righe.length === 0) return null;

  const totale = currentTotal();
  const voci = righe.map(l => ({ catId: l.catId, qty: l.qty, extra: l.extra || null, prezzoManuale: (l.prezzoManuale !== undefined ? l.prezzoManuale : null), supplLattosio: l.supplLattosio || 0 }));
  let ordineFinale, annuncio;

  if(editingOrderNumber !== null){
    const ordine = openOrders.find(o => o.numero === editingOrderNumber);
    if(ordine){
      ordine.voci = voci;
      ordine.totale = totale;
      ordine.nomeCliente = nomeClienteCorrente.trim() || null;
      ordine.orarioRitiro = orarioRitiroCorrente || null;
      ordine.tavolo = tavoloCorrente || null;
      ordine.noteOrdine = noteOrdineCorrente.trim() || null;
      ordineFinale = ordine;
    }
    annuncio = `Ordine ${ordineFinale.numero} aggiornato. Nuovo totale ${Math.round(totale)} euro.`;
    uscitaModalitaModifica();
  } else {
    orderCounter += 1;
    ordineFinale = { numero: orderCounter, orario: new Date(), voci, totale, nomeCliente: nomeClienteCorrente.trim() || null, orarioRitiro: orarioRitiroCorrente || null, tavolo: tavoloCorrente || null, noteOrdine: noteOrdineCorrente.trim() || null };
    openOrders.unshift(ordineFinale);
    annuncio = `Ordine ${ordineFinale.numero}. Totale ${Math.round(totale)} euro.`;
  }

  currentOrder = [];
  nomeClienteCorrente = '';
  orarioRitiroCorrente = '';
  tavoloCorrente = null;
  noteOrdineCorrente = '';
  resettaQuantitaSelezionata();
  document.getElementById('nomeClienteInput').value = '';
  document.getElementById('orarioRitiroInput').value = '';
  document.getElementById('noteOrdineInput').value = '';
  renderCurrent();
  renderBoard();
  registraStorico(ordineFinale);

  try{
    const utter = new SpeechSynthesisUtterance(annuncio);
    utter.lang = 'it-IT';
    speechSynthesis.speak(utter);
  } catch(e){ /* sintesi vocale non disponibile su questo dispositivo */ }

  return ordineFinale;
}

// ---------------------------------------------------------------------
// STAMPA DIRETTA VIA QZ TRAY — manda i dati grezzi (ESC/POS) direttamente
// alla stampante USB (BIXOLON SRP-F310), parlandole via USB grezzo esattamente
// come fa Waiterio, saltando completamente driver e spooler di Windows.
// Se QZ Tray non è installato/avviato, si torna automaticamente alla stampa
// normale del browser.
// ---------------------------------------------------------------------
const STAMPANTE_USB_VENDOR = '0x1504';  // BIXOLON
const STAMPANTE_USB_PRODUCT = '0x0016'; // SRP-F310
const RIGA_ESC = 42; // caratteri per riga in formato testo grezzo (scontrino cliente, invariato)
const RIGA_ESC_COMANDA = 32; // caratteri per riga per la comanda cucina, stampata a 58mm

// La stampante non stampa correttamente il simbolo "€" (la sua codifica
// interna non lo supporta), quindi sui documenti stampati usiamo "EUR"
// al posto del simbolo. A schermo continua a usare "€" (fmtEuro normale).
const fmtEuroEsc = n => 'EUR ' + n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2});

// La stampante non gestisce bene lettere accentate (è, ù, ì...) né simboli
// speciali: li convertiamo in caratteri semplici solo per i documenti
// stampati, così non escono mai caratteri storpiati sullo scontrino.
const MAPPA_ACCENTI = {'à':'a','á':'a','è':'e','é':'e','ì':'i','í':'i','ò':'o','ó':'o','ù':'u','ú':'u',
  'À':'A','É':'E','È':'E','Ì':'I','Ò':'O','Ù':'U','ü':'u','Ü':'U','ç':'c'};
function sanificaPerStampa(testo){
  return testo.replace(/[àáèéìíòóùúÀÉÈÌÒÙüÜç]/g, ch => MAPPA_ACCENTI[ch] || ch)
              .replace(/[^\x00-\x7F]/g, ''); // rimuove qualsiasi altro carattere non standard rimasto
}

// QZ Tray richiede una promessa di certificato/firma anche per l'uso semplice
// senza certificato: qui diciamo "nessuna firma", quindi la prima volta QZ
// Tray chiederà conferma manuale nella sua finestra (va bene, basta consentire).
if(typeof qz !== 'undefined'){
  qz.security.setCertificatePromise(function(resolve){ resolve(); });
  qz.security.setSignaturePromise(function(){
    return function(resolve){ resolve(); };
  });
}

const ESC = '\x1B', GS = '\x1D';
const P_INIT = ESC + '@';
const P_BOLD_ON = ESC + 'E' + '\x01';
const P_BOLD_OFF = ESC + 'E' + '\x00';
const P_GRANDE_ON = GS + '!' + '\x01'; // doppia altezza (larghezza normale, per non occupare troppo spazio)
const P_GRANDE_OFF = GS + '!' + '\x00';
const P_GRASSETTO_VARIAZIONE_ON = ESC + 'E' + '\x01'; // grassetto per le variazioni (stesso font normale, solo più marcato)
const P_GRASSETTO_VARIAZIONE_OFF = ESC + 'E' + '\x00';
const P_CENTRO = ESC + 'a' + '\x01';
const P_SINISTRA = ESC + 'a' + '\x00';
const P_TAGLIO = GS + 'V' + '\x00';

function padDestraEsc(sinistra, destra, larghezza){
  const spazi = larghezza - sinistra.length - destra.length;
  return sinistra + ' '.repeat(Math.max(spazi, 1)) + destra;
}
// Come padDestraEsc, ma per quando la parte sinistra contiene codici di
// formattazione (grassetto/dimensione) che non occupano spazio sulla carta:
// il conteggio dei caratteri per l'allineamento usa il testo SENZA codici.
// moltiplicatore: quanto spazio fisico occupa ogni carattere della parte
// sinistra sulla carta (2 se scritta a doppia larghezza, 1 se normale).
function padDestraEscFormattata(sinistraVisibile, sinistraConCodici, destra, larghezza, moltiplicatore){
  moltiplicatore = moltiplicatore || 1;
  const spazi = larghezza - (sinistraVisibile.length * moltiplicatore) - destra.length;
  return sinistraConCodici + ' '.repeat(Math.max(spazi, 1)) + destra;
}

// Va a capo per parole intere quando una riga supera la larghezza data, invece
// di lasciare che sia la stampante a tagliarla a metà parola (utile sul
// rotolo stretto da 58mm della comanda cucina, dove il margine è poco).
function avvolgiTesto(testo, larghezza){
  const parole = testo.split(' ').filter(Boolean);
  const righe = [];
  let riga = '';
  parole.forEach(parola => {
    if(riga && (riga + ' ' + parola).length > larghezza){
      righe.push(riga);
      riga = parola;
    } else {
      riga = riga ? riga + ' ' + parola : parola;
    }
  });
  if(riga) righe.push(riga);
  return righe.length ? righe : [''];
}

function escComandaCucina(ordine){
  let t = P_INIT + '\n\n\n\n\n' + P_CENTRO + P_BOLD_ON; // ~2cm di spazio prima dell'intestazione, per agganciare la comanda nel porta-comande
  t += P_GRANDE_ON + P_BOLD_ON + `N.${String(ordine.numero).padStart(3,'0')}  ${fmtOra(ordine.orario)}` + P_BOLD_OFF + P_GRANDE_OFF + '\n';
  t += `${fmtData(ordine.orario)}\n`;
  if(ordine.tavolo) t += 'TAVOLO ' + ordine.tavolo + '\n';
  if(ordine.nomeCliente) t += sanificaPerStampa(ordine.nomeCliente) + '\n';
  if(ordine.orarioRitiro) t += P_BOLD_ON + '*** RITIRO ORE ' + ordine.orarioRitiro + ' ***' + P_BOLD_OFF + '\n';
  if(ordine.noteOrdine){
    avvolgiTesto(sanificaPerStampa(ordine.noteOrdine).toUpperCase(), RIGA_ESC_COMANDA - 8).forEach(riga => {
      t += P_BOLD_ON + '*** ' + riga + ' ***' + P_BOLD_OFF + '\n';
    });
  }
  t += P_BOLD_OFF + P_SINISTRA + '-'.repeat(RIGA_ESC_COMANDA) + '\n';
  // Le bibite non vanno in cucina: escono solo sullo scontrino cliente.
  const vociCucina = ordine.voci.filter(v => prod(v.catId).category !== '🍺 Bevande');
  const categorie = [...new Set(vociCucina.map(v => prod(v.catId).category))];
  categorie.forEach(cat => {
    t += P_BOLD_ON + cat.replace(/[^\x00-\x7F]/g, '') + P_BOLD_OFF + '\n';
    vociCucina.filter(v => prod(v.catId).category === cat).forEach(v => {
      const p = prod(v.catId);
      avvolgiTesto(sanificaPerStampa(`${v.qty} ${p.base}`).toUpperCase(), RIGA_ESC_COMANDA).forEach(riga => {
        t += P_GRANDE_ON + P_BOLD_ON + riga + P_BOLD_OFF + P_GRANDE_OFF + '\n';
      });
      if(p.note){
        avvolgiTesto(sanificaPerStampa(p.note).toUpperCase(), RIGA_ESC_COMANDA - 4).forEach((riga, i) => {
          t += P_GRASSETTO_VARIAZIONE_ON + `  ${i === 0 ? '-' : ' '} ${riga}\n` + P_GRASSETTO_VARIAZIONE_OFF;
        });
      }
      noteLineaCucina(v).forEach(g => {
        avvolgiTesto(sanificaPerStampa(g).toUpperCase(), RIGA_ESC_COMANDA - 4).forEach((riga, i) => {
          t += P_GRASSETTO_VARIAZIONE_ON + `  ${i === 0 ? '-' : ' '} ${riga}\n` + P_GRASSETTO_VARIAZIONE_OFF;
        });
      });
    });
  });
  t += '\n\n\n' + P_TAGLIO; // spazio normale dopo, il taglio è già più in basso
  return t;
}

function escScontrinoCliente(ordine){
  let t = P_INIT + P_CENTRO + P_BOLD_ON;
  t += P_GRANDE_ON + P_BOLD_ON + `N.${String(ordine.numero).padStart(3,'0')}  ${fmtOra(ordine.orario)}` + P_BOLD_OFF + P_GRANDE_OFF + '\n';
  t += `${fmtData(ordine.orario)}\n`;
  if(ordine.tavolo) t += 'TAVOLO ' + ordine.tavolo + '\n';
  if(ordine.nomeCliente) t += sanificaPerStampa(ordine.nomeCliente) + '\n';
  if(ordine.orarioRitiro) t += P_BOLD_ON + '*** RITIRO ORE ' + ordine.orarioRitiro + ' ***' + P_BOLD_OFF + '\n';
  if(ordine.noteOrdine) t += P_BOLD_ON + '*** ' + sanificaPerStampa(ordine.noteOrdine).toUpperCase() + ' ***' + P_BOLD_OFF + '\n';
  t += P_BOLD_OFF + P_SINISTRA + '-'.repeat(RIGA_ESC) + '\n';
  let totale = 0;
  const categorie = [...new Set(ordine.voci.map(v => prod(v.catId).category))];
  categorie.forEach(cat => {
    t += P_BOLD_ON + cat.replace(/[^\x00-\x7F]/g, '') + P_BOLD_OFF + '\n';
    ordine.voci.filter(v => prod(v.catId).category === cat).forEach(v => {
      const p = prod(v.catId);
      const prezzo = prezzoLinea(v);
      totale += prezzo * v.qty;
      const label = p.base + (p.note ? ' ' + p.note : '');
      const testoVisibile = `${v.qty} ${label}`;
      const testoFormattato = P_GRANDE_ON + P_BOLD_ON + sanificaPerStampa(testoVisibile).toUpperCase() + P_BOLD_OFF + P_GRANDE_OFF;
      t += padDestraEscFormattata(testoVisibile, testoFormattato, fmtEuroEsc(prezzo * v.qty), RIGA_ESC, 1) + '\n';
      noteLineaEsc(v).forEach(g => t += P_GRASSETTO_VARIAZIONE_ON + `  ${sanificaPerStampa(g).toUpperCase()}\n` + P_GRASSETTO_VARIAZIONE_OFF);
    });
  });
  t += '-'.repeat(RIGA_ESC) + '\n';
  t += P_BOLD_ON + padDestraEsc('TOTALE', fmtEuroEsc(totale), RIGA_ESC) + P_BOLD_OFF + '\n';
  t += '\n\n\n\n\n' + P_TAGLIO;
  return t;
}

async function qzDisponibile(){
  if(typeof qz === 'undefined') return false;
  try{
    if(!qz.websocket.isActive()){
      await qz.websocket.connect();
    }
    return true;
  } catch(e){
    console.warn('QZ Tray non raggiungibile:', e);
    return false;
  }
}

// Trova automaticamente su quale "interfaccia" e "endpoint" USB la BIXOLON
// accetta i dati (varia da stampante a stampante, quindi lo chiediamo a QZ
// Tray invece di indovinare i numeri a mano).
let _usbInterfaccia = null, _usbEndpoint = null;
async function trovaUsbInterfacciaEndpoint(){
  if(_usbInterfaccia && _usbEndpoint) return;
  const interfacce = await qz.usb.listInterfaces(STAMPANTE_USB_VENDOR, STAMPANTE_USB_PRODUCT);
  for(const iface of interfacce){
    const endpoints = await qz.usb.listEndpoints(STAMPANTE_USB_VENDOR, STAMPANTE_USB_PRODUCT, iface);
    // Cerchiamo un endpoint di "uscita" (verso la stampante): per convenzione
    // USB gli endpoint di uscita hanno il bit più alto a 0 (es. 0x01, 0x02...),
    // quelli di ingresso (dalla stampante verso il PC) lo hanno a 1 (es. 0x81).
    const uscita = endpoints.find(e => (parseInt(e, 16) & 0x80) === 0);
    if(uscita){
      _usbInterfaccia = iface;
      _usbEndpoint = uscita;
      return;
    }
  }
  throw new Error('Nessun endpoint USB di uscita trovato sulla stampante');
}

// Manda un singolo testo alla stampante (assume che sia già stata "presa in
// carico" con claimDevice — vedi stampaOrdine più sotto, che si occupa di
// prendere/rilasciare la stampante una volta sola anche quando si stampano
// comanda e scontrino insieme, per ridurre le richieste di autorizzazione).
async function stampaViaQZ(testoGrezzo){
  await qz.usb.sendData(STAMPANTE_USB_VENDOR, STAMPANTE_USB_PRODUCT, _usbEndpoint, sanificaPerStampa(testoGrezzo));
}

// Manda alla stampante solo il contenuto scelto (cucina, cliente o entrambe).
// Usa QZ Tray (diretto, affidabile). Se QZ Tray non è proprio raggiungibile,
// usa la finestra di stampa del browser come riserva. Se invece QZ Tray è
// collegato ma la stampa fallisce (es. non hai fatto in tempo a confermare
// la finestrella "Action Required"), avvisa chiaramente invece di tornare
// in silenzio al metodo del browser.
async function stampaOrdine(tipo, ordine){
  const disponibile = await qzDisponibile();
  // Se l'ordine è fatto solo di bibite, non c'è nulla da mandare in cucina.
  const haVociPerCucina = ordine.voci.some(v => prod(v.catId).category !== '🍺 Bevande');
  const stampaCucina = (tipo === 'cucina' || tipo === 'entrambe') && haVociPerCucina;
  const stampaCliente = (tipo === 'cliente' || tipo === 'entrambe');

  if(disponibile){
    try{
      await trovaUsbInterfacciaEndpoint();
      // Un solo "claim" per tutta l'operazione (comanda + scontrino insieme
      // contano come UNA autorizzazione, non due): rilasciamo sempre alla
      // fine, così la stampante non resta mai occupata tra un ordine e l'altro.
      await qz.usb.claimDevice(STAMPANTE_USB_VENDOR, STAMPANTE_USB_PRODUCT, _usbInterfaccia);
      try{
        // Concateniamo comanda + scontrino in un SOLO invio alla stampante
        // (invece di due) così QZ Tray chiede l'autorizzazione una volta
        // sola invece di due: la carta viene comunque tagliata tra i due,
        // perché ogni comanda/scontrino finisce già con il comando di taglio.
        let testoCompleto = '';
        if(stampaCucina) testoCompleto += escComandaCucina(ordine);
        if(stampaCliente) testoCompleto += escScontrinoCliente(ordine);
        if(testoCompleto) await stampaViaQZ(testoCompleto);
      } finally {
        await qz.usb.releaseDevice(STAMPANTE_USB_VENDOR, STAMPANTE_USB_PRODUCT).catch(()=>{});
      }
      return;
    } catch(e){
      console.error('Errore durante la stampa via QZ Tray:', e);
      alert(
        'QZ Tray è collegato ma la stampa non è andata a buon fine.\n\n' +
        'Se è comparsa una finestrella "Action Required" di QZ Tray e non hai fatto in tempo a cliccare "Allow", riprova: questa volta tieni il mouse pronto e clicca Allow appena compare, spuntando anche "Remember this decision" così capiterà solo questa volta.\n\n' +
        'Dettaglio tecnico: ' + (e && e.message ? e.message : e)
      );
      return; // non torniamo al browser: sappiamo già che su questo PC non stampa
    }
  }

  const area = document.getElementById('printArea');
  let html = '';
  if(stampaCucina) html += htmlComandaCucina(ordine);
  if(stampaCucina && stampaCliente) html += '<div class="print-pagebreak"></div>';
  if(stampaCliente) html += htmlScontrinoCliente(ordine);
  area.innerHTML = html;
  window.print();
}

document.getElementById('annullaOrdineBtn').addEventListener('click', () => {
  if(!currentOrder.some(l => l.qty > 0)) return;
  if(!confirm("Annullare l'ordine in corso? I prodotti aggiunti andranno persi, senza essere stampati né salvati.")) return;
  if(editingOrderNumber !== null){
    // L'ordine originale è già stato inviato in cucina in precedenza: si
    // scartano solo le aggiunte fatte ora, l'ordine originale resta intatto.
    uscitaModalitaModifica();
  } else {
    currentOrder = [];
    nomeClienteCorrente = '';
    orarioRitiroCorrente = '';
    tavoloCorrente = null;
    noteOrdineCorrente = '';
    resettaQuantitaSelezionata();
    document.getElementById('nomeClienteInput').value = '';
    document.getElementById('orarioRitiroInput').value = '';
    document.getElementById('noteOrdineInput').value = '';
    document.getElementById('orderPanelTitle').textContent = 'Ordine in corso';
    document.getElementById('editBanner').style.display = 'none';
    renderCurrent();
  }
  mostraSchermata('tavoli');
});

// MODIFICA DI UN ORDINE GIÀ INVIATO
// ---------------------------------------------------------------------
function enterEditMode(numero){
  const ordine = openOrders.find(o => o.numero === numero);
  if(!ordine) return;

  editingOrderNumber = numero;
  currentOrder = ordine.voci.map(v => ({ lineId: nextLineId++, catId: v.catId, qty: v.qty, extra: v.extra || null, prezzoManuale: (v.prezzoManuale !== undefined && v.prezzoManuale !== null) ? v.prezzoManuale : undefined, supplLattosio: v.supplLattosio || 0 }));
  nomeClienteCorrente = ordine.nomeCliente || '';
  document.getElementById('nomeClienteInput').value = nomeClienteCorrente;
  orarioRitiroCorrente = ordine.orarioRitiro || '';
  document.getElementById('orarioRitiroInput').value = orarioRitiroCorrente;
  tavoloCorrente = ordine.tavolo || null;
  noteOrdineCorrente = ordine.noteOrdine || '';
  document.getElementById('noteOrdineInput').value = noteOrdineCorrente;

  document.getElementById('orderPanelTitle').textContent = `Modifica ordine N.${String(numero).padStart(3,'0')}`;

  const banner = document.getElementById('editBanner');
  banner.style.display = 'flex';
  banner.innerHTML = `<span>Stai aggiungendo prodotti all'ordine N.${String(numero).padStart(3,'0')}</span><button id="annullaModificaBtn">Annulla</button>`;
  document.getElementById('annullaModificaBtn').addEventListener('click', uscitaModalitaModifica);

  renderCurrent();
}

function uscitaModalitaModifica(){
  editingOrderNumber = null;
  currentOrder = [];
  nomeClienteCorrente = '';
  orarioRitiroCorrente = '';
  tavoloCorrente = null;
  noteOrdineCorrente = '';
  resettaQuantitaSelezionata();
  document.getElementById('nomeClienteInput').value = '';
  document.getElementById('orarioRitiroInput').value = '';
  document.getElementById('noteOrdineInput').value = '';
  document.getElementById('orderPanelTitle').textContent = 'Ordine in corso';
  document.getElementById('editBanner').style.display = 'none';
  renderCurrent();
}

// ---------------------------------------------------------------------
// SPOSTA UN CONTO da un tavolo all'altro, o da/verso l'asporto
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// TASTIERINO PER CORREGGERE IL PREZZO — inserimento a cifre (in centesimi,
// come una cassa), così non serve digitare la virgola dei decimali.
// ---------------------------------------------------------------------
let prezzoLineIdCorrente = null;
let prezzoCentesimiCorrente = '';

function apriPrezzoOverlay(lineId){
  const linea = currentOrder.find(l => l.lineId === lineId);
  if(!linea) return;
  prezzoLineIdCorrente = lineId;
  prezzoCentesimiCorrente = ''; // parte sempre da zero, così le cifre digitate sostituiscono il prezzo (non si sommano)
  document.getElementById('prezzoAttuale').textContent = 'Prezzo in comanda: ' + fmtEuro(prezzoLinea(linea));
  aggiornaPrezzoDisplay();
  document.getElementById('prezzoOverlay').style.display = 'flex';
}

function aggiornaPrezzoDisplay(){
  const centesimi = parseInt(prezzoCentesimiCorrente || '0');
  document.getElementById('prezzoDisplay').textContent = fmtEuro(centesimi / 100);
}

document.querySelectorAll('.prezzo-tasto[data-cifra]').forEach(btn => {
  btn.addEventListener('click', () => {
    // Tolgo eventuali zeri iniziali superflui, max 5 cifre (999,99€)
    let nuovo = (prezzoCentesimiCorrente + btn.dataset.cifra).replace(/^0+(?=\d)/, '');
    if(nuovo.length > 5) return;
    prezzoCentesimiCorrente = nuovo;
    aggiornaPrezzoDisplay();
  });
});
document.getElementById('prezzoCancella').addEventListener('click', () => {
  prezzoCentesimiCorrente = prezzoCentesimiCorrente.slice(0, -1);
  aggiornaPrezzoDisplay();
});
document.getElementById('prezzoConferma').addEventListener('click', () => {
  const linea = currentOrder.find(l => l.lineId === prezzoLineIdCorrente);
  if(linea){
    linea.prezzoManuale = parseInt(prezzoCentesimiCorrente || '0') / 100;
    renderCurrent();
  }
  document.getElementById('prezzoOverlay').style.display = 'none';
});
document.getElementById('chiudiPrezzo').addEventListener('click', () => {
  document.getElementById('prezzoOverlay').style.display = 'none';
});
document.getElementById('prezzoOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'prezzoOverlay') document.getElementById('prezzoOverlay').style.display = 'none';
});

function apriSpostaOverlay(numero){
  const ordine = openOrders.find(o => o.numero === numero);
  if(!ordine) return;

  let opzioni = '';
  for(let n = 1; n <= NUMERO_TAVOLI; n++){
    if(ordine.tavolo === n) continue; // è già lì
    const occupato = openOrders.some(o => o.tavolo === n && o.numero !== numero);
    opzioni += `<button class="sposta-opzione ${occupato ? 'occupata' : ''}" data-dest="${n}" ${occupato ? 'disabled' : ''}>
      Tavolo ${n}${occupato ? ' <span class=\"sposta-nota\">(occupato)</span>' : ''}
    </button>`;
  }
  if(ordine.tavolo){
    opzioni += `<button class="sposta-opzione" data-dest="__asporto__">📦 Asporto (nessun tavolo)</button>`;
  }

  document.getElementById('spostaContenuto').innerHTML = `
    <p style="margin:0 0 14px;color:#c9bda3;">Ordine N.${String(numero).padStart(3,'0')} — dove lo sposto? (il nome cliente resta invariato)</p>
    <div class="sposta-lista">${opzioni}</div>
  `;
  document.getElementById('spostaOverlay').dataset.numero = numero;
  document.getElementById('spostaOverlay').style.display = 'flex';

  document.querySelectorAll('.sposta-opzione:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => eseguiSposta(numero, btn.dataset.dest));
  });
}

function eseguiSposta(numero, dest){
  const ordine = openOrders.find(o => o.numero === numero);
  if(!ordine) return;
  ordine.tavolo = (dest === '__asporto__') ? null : parseInt(dest);
  if(editingOrderNumber === numero){
    tavoloCorrente = ordine.tavolo;
  }
  document.getElementById('spostaOverlay').style.display = 'none';
  renderBoard();
  renderTavoli();
}

document.getElementById('chiudiSposta').addEventListener('click', () => {
  document.getElementById('spostaOverlay').style.display = 'none';
});
document.getElementById('spostaOverlay').addEventListener('click', (e) => {

});

// ---------------------------------------------------------------------
// TAVOLI NUMERATI — toccando un tavolo si riprende il conto già aperto
// (se c'è) o se ne inizia uno nuovo, e si passa alla schermata Ordine.
// Verde = tavolo occupato (conto aperto), Rosso = tavolo libero.
// ---------------------------------------------------------------------
const NUMERO_TAVOLI = 6;

function selezionaTavolo(n){
  const ordineEsistente = openOrders.find(o => o.tavolo === n);

  if(ordineEsistente){
    enterEditMode(ordineEsistente.numero);
  } else {
    if(editingOrderNumber !== null) uscitaModalitaModifica();
    currentOrder = [];
    nomeClienteCorrente = '';
    orarioRitiroCorrente = '';
    tavoloCorrente = n;
    noteOrdineCorrente = '';
    resettaQuantitaSelezionata();
    document.getElementById('nomeClienteInput').value = '';
    document.getElementById('orarioRitiroInput').value = '';
    document.getElementById('noteOrdineInput').value = '';
    document.getElementById('orderPanelTitle').textContent = `Tavolo ${n}`;
    document.getElementById('editBanner').style.display = 'none';
  }
  renderCurrent();
  mostraSchermata('ordine');
}

function renderTavoli(){
  const grid = document.getElementById('tavoliGrid');
  grid.innerHTML = '';
  for(let n = 1; n <= NUMERO_TAVOLI; n++){
    const occupato = openOrders.some(o => o.tavolo === n);
    const btn = document.createElement('button');
    btn.className = `tavolo-btn-grande ${occupato ? 'occupato' : 'libero'}`;
    btn.innerHTML = `${n}<span class="etichetta">${occupato ? 'occupato' : 'libero'}</span>`;
    btn.addEventListener('click', () => selezionaTavolo(n));
    grid.appendChild(btn);
  }
}

// ---------------------------------------------------------------------
// BOARD ORDINI APERTI + evidenziazione oltre 15 minuti
//
// Gli ordini con un orario di ritiro programmato (es. ordini telefonici da
// preparare più tardi) NON stanno in mezzo agli ordini in corso: restano
// nella sezione "Ritiri programmati" finché manca più di mezz'ora, poi
// passano da soli nella fila normale, evidenziati in dorato per un po'.
// ---------------------------------------------------------------------
const SOGLIA_ATTIVAZIONE_RITIRO_MINUTI = 15;

function minutiAlRitiro(o){
  if(!o.orarioRitiro) return null;
  const [h, m] = o.orarioRitiro.split(':').map(Number);
  const target = new Date();
  target.setHours(h, m, 0, 0);
  return (target.getTime() - Date.now()) / 60000;
}

function renderBoard(){
  const board = document.getElementById('board');
  const boardRitiriWrap = document.getElementById('boardRitiriWrap');
  const boardRitiri = document.getElementById('boardRitiri');

  const programmati = openOrders.filter(o => {
    const m = minutiAlRitiro(o);
    return m !== null && m > SOGLIA_ATTIVAZIONE_RITIRO_MINUTI;
  });
  const attivi = openOrders.filter(o => !programmati.includes(o));

  if(programmati.length === 0){
    boardRitiriWrap.style.display = 'none';
  } else {
    boardRitiriWrap.style.display = 'flex';
    boardRitiri.innerHTML = programmati.map(o => {
      const m = Math.round(minutiAlRitiro(o));
      return `
        <div class="order-card" data-numero="${o.numero}">
          <span class="num">N.${String(o.numero).padStart(3,'0')}</span>
          ${o.tavolo ? `<span class="cliente">Tavolo ${o.tavolo}</span>` : ''}
          ${o.nomeCliente ? `<span class="cliente">${o.nomeCliente}</span>` : ''}
          <span class="ritiro-badge">⏰ ${o.orarioRitiro}</span>
          <span class="ritiro-countdown">tra ${m < 60 ? m + ' min' : Math.floor(m/60) + 'h ' + (m%60) + 'min'}</span>
          <button class="edit-btn" data-numero="${o.numero}" title="Aggiungi prodotti">✎</button>
          <button class="sposta-btn" data-numero="${o.numero}" title="Sposta questo conto">🔀</button>
          <button class="close-btn" data-numero="${o.numero}" title="Ordine servito">✔</button>
        </div>`;
    }).join('');
    collegaEventiCard(boardRitiri);
  }

  if(attivi.length === 0){
    board.innerHTML = '<div class="board-empty">Nessun ordine aperto al momento.</div>';
    salvaStato();
    return;
  }
  board.innerHTML = attivi.map(o => {
    const minuti = (Date.now() - o.orario.getTime()) / 60000;
    const late = minuti > 15;
    const ritiroAttivato = !!o.orarioRitiro; // è qui perché il suo orario è ormai vicino/passato
    return `
      <div class="order-card ${late ? 'late' : ''} ${ritiroAttivato ? 'ritiro-attivato' : ''}" data-numero="${o.numero}">
        <span class="num">N.${String(o.numero).padStart(3,'0')}</span>
        ${o.tavolo ? `<span class="cliente">Tavolo ${o.tavolo}</span>` : ''}
        ${o.nomeCliente ? `<span class="cliente">${o.nomeCliente}</span>` : ''}
        ${o.orarioRitiro ? `<span class="ritiro-badge">⏰ ${o.orarioRitiro}</span>` : ''}
        <span class="elapsed">${late ? '⚠️' : ''} ${Math.floor(minuti)}′ · ${fmtEuro(o.totale)}</span>
        <button class="edit-btn" data-numero="${o.numero}" title="Aggiungi prodotti">✎</button>
        <button class="sposta-btn" data-numero="${o.numero}" title="Sposta questo conto">🔀</button>
        <button class="close-btn" data-numero="${o.numero}" title="Ordine servito">✔</button>
      </div>`;
  }).join('');
  collegaEventiCard(board);
  salvaStato();
}

function collegaEventiCard(contenitore){
  contenitore.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); enterEditMode(parseInt(btn.dataset.numero)); mostraSchermata('ordine'); });
  });
  contenitore.querySelectorAll('.sposta-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); apriSpostaOverlay(parseInt(btn.dataset.numero)); });
  });
  contenitore.querySelectorAll('.order-card').forEach(card => {
    card.addEventListener('click', () => { enterEditMode(parseInt(card.dataset.numero)); mostraSchermata('ordine'); });
  });
  contenitore.querySelectorAll('.close-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = parseInt(btn.dataset.numero);
      openOrders = openOrders.filter(o => o.numero !== n);
      if(editingOrderNumber === n) uscitaModalitaModifica();
      renderBoard();
      renderTavoli();
    });
  });
}

setInterval(renderBoard, 15000); // aggiorna i tempi trascorsi ogni 15 secondi

// ---------------------------------------------------------------------
// MICROFONO BREVE — usato solo per dettare la variazione di UNA riga alla
// volta (es. "senza origano"). Non aggiunge prodotti: quelli si scelgono
// sempre dai tasti del menù.
// ---------------------------------------------------------------------
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function dettaBreve(onStart, onRisultato, onFine){
  if(!SpeechRec){
    alert('Il riconoscimento vocale non è supportato su questo browser. Prova con Chrome o Edge.');
    return;
  }
  const rec = new SpeechRec();
  rec.lang = 'it-IT';
  rec.continuous = false;
  rec.interimResults = false;

  rec.addEventListener('start', () => { if(onStart) onStart(); });
  rec.addEventListener('result', (event) => {
    const testo = event.results[0][0].transcript;
    if(onRisultato) onRisultato(testo);
  });
  rec.addEventListener('end', () => { if(onFine) onFine(); });
  rec.addEventListener('error', (event) => {
    if(onFine) onFine();
    let messaggio = 'Non sono riuscito a capire, riprova.';
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      messaggio = 'Il microfono non è autorizzato. Vai nelle impostazioni del browser (o di Windows) e consenti l\'accesso al microfono per questo sito.';
    } else if(event.error === 'no-speech'){
      messaggio = 'Non ho sentito nessuna voce. Prova a parlare più forte e più vicino al microfono del computer.';
    } else if(event.error === 'network'){
      messaggio = 'Il riconoscimento vocale ha bisogno di una connessione a internet, e in questo momento non riesce a collegarsi. Controlla che il computer sia connesso a internet (non solo alla stampante).';
    } else if(event.error === 'audio-capture'){
      messaggio = 'Non trovo nessun microfono collegato al computer.';
    }
    alert(messaggio);
  });

  try{ rec.start(); } catch(e){ /* già in ascolto */ }
}

// ---------------------------------------------------------------------
// NOME CLIENTE (facoltativo) — dettato o scritto, resta collegato
// all'ordine in corso e viene stampato sia sulla comanda cucina che sullo
// scontrino cliente.
// ---------------------------------------------------------------------
const nomeClienteInput = document.getElementById('nomeClienteInput');
nomeClienteInput.addEventListener('input', () => {
  nomeClienteCorrente = nomeClienteInput.value;
  salvaStato();
});
document.getElementById('nomeClienteMic').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  dettaBreve(
    () => { btn.classList.add('listening'); btn.textContent = '●'; },
    (testo) => {
      btn.classList.remove('listening'); btn.textContent = '🎤';
      if(testo){
        // Prima lettera maiuscola, così "mario" diventa "Mario"
        nomeClienteCorrente = testo.charAt(0).toUpperCase() + testo.slice(1);
        nomeClienteInput.value = nomeClienteCorrente;
        salvaStato();
      }
    },
    () => { btn.classList.remove('listening'); btn.textContent = '🎤'; }
  );
});

const orarioRitiroInput = document.getElementById('orarioRitiroInput');
orarioRitiroInput.addEventListener('input', () => {
  orarioRitiroCorrente = orarioRitiroInput.value;
  salvaStato();
});
document.getElementById('orarioRitiroClear').addEventListener('click', () => {
  orarioRitiroCorrente = '';
  orarioRitiroInput.value = '';
  salvaStato();
});

const noteOrdineInput = document.getElementById('noteOrdineInput');
noteOrdineInput.addEventListener('input', () => {
  noteOrdineCorrente = noteOrdineInput.value;
  renderReceiptPreview();
  salvaStato();
});
document.getElementById('noteOrdineMic').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  dettaBreve(
    () => { btn.classList.add('listening'); btn.textContent = '●'; },
    (testo) => {
      btn.classList.remove('listening'); btn.textContent = '🎤';
      if(testo){
        noteOrdineCorrente = testo.charAt(0).toUpperCase() + testo.slice(1);
        noteOrdineInput.value = noteOrdineCorrente;
        renderReceiptPreview();
        salvaStato();
      }
    },
    () => { btn.classList.remove('listening'); btn.textContent = '🎤'; }
  );
});

// ---------------------------------------------------------------------
caricaStato();
nomeClienteInput.value = nomeClienteCorrente;
orarioRitiroInput.value = orarioRitiroCorrente;
noteOrdineInput.value = noteOrdineCorrente;
renderMenu();
renderCurrent();
renderBoard();
mostraSchermata('tavoli');

    stato.className = 'qz-status no';
  }
})();
